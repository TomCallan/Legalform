document:
  id: "nda-sample-2026"
  title: "MUTUAL NON-DISCLOSURE AND CONFIDENTIALITY AGREEMENT"
  jurisdiction: "State of Delaware, United States of America"
  expires_in_days: 30
  max_submissions_per_email: 1
  max_submissions_per_ip: 3
  require_email_verification: false
  admin_notification_email: "tomcallan0@outlook.com"
  legal_footer: "IN WITNESS WHEREOF, the Parties have executed this Mutual Non-Disclosure Agreement electronically as of the timestamp recorded below, agreeing that such electronic execution constitutes a legally binding signature pursuant to the Electronic Signatures in Global and National Commerce Act (ESIGN, 15 U.S.C. § 7001 et seq.) and the Uniform Electronic Transactions Act (UETA)."

sections:
  - type: "static"
    content: |
      ## PREAMBLE & PARTIES
      This Mutual Non-Disclosure Agreement ("Agreement") is entered into and made effective as of the exact date and UTC timestamp recorded upon execution below by and between the Disclosing Party and the Receiving Party identified herein (collectively, the "Parties").

  - type: "form"
    fields:
      - name: "disclosing_party"
        label: "Disclosing Party Legal Entity"
        type: "text"
        required: true
        value: "Acme Corporation"

      - name: "receiving_party"
        label: "Receiving Party Legal Entity / Signer Name"
        type: "text"
        required: true
        placeholder: "Enter Full Legal Entity or Individual Name"

      - name: "signer_email"
        label: "Signer Official Email Address"
        type: "email"
        required: true
        placeholder: "name@company.com"

  - type: "static"
    content: |
      ## 1. DEFINITION OF CONFIDENTIAL INFORMATION
      "Confidential Information" shall mean all information or material that has or could have commercial value or other utility in the business in which Disclosing Party is engaged. If Information is in written form, the Disclosing Party shall label or stamp the materials with the word "Confidential" or some similar warning. Confidential Information includes, without limitation, technical data, trade secrets, research, product plans, source code, software, algorithms, pricing, financial data, and business strategies.

      ## 2. OBLIGATIONS OF RECEIVING PARTY
      Receiving Party shall hold and maintain the Confidential Information in strictest confidence for the sole and exclusive benefit of the Disclosing Party. Receiving Party shall carefully restrict access to Confidential Information to employees, contractors, and third parties as is reasonably required and shall require those persons to sign non-disclosure restrictions at least as protective as those in this Agreement. Receiving Party shall not, without prior written approval of Disclosing Party, use for Receiving Party's own benefit, publish, copy, or otherwise disclose to others, or permit the use by others for their benefit or to the detriment of Disclosing Party, any Confidential Information.

      ## 3. TERM & DURATION OF CONFIDENTIALITY
      The non-disclosure obligations of this Agreement shall survive and remain binding upon the Receiving Party for a period of five (5) years from the execution timestamp recorded herein, or for as long as the Confidential Information remains a trade secret under applicable law, whichever is longer.

      ## 4. GOVERNING LAW & JURISDICTION
      This Agreement shall be governed by, construed, and enforced in accordance with the laws of the State of Delaware, without regard to its conflict of law principles. Any legal suit, action, or proceeding arising out of or related to this Agreement shall be instituted exclusively in the federal or state courts located in the State of Delaware.

      ## 5. SEVERABILITY & INTEGRATION
      If any provision of this Agreement is held to be invalid or unenforceable, such provision shall be modified to the minimum extent necessary to make it valid and enforceable, and the remaining provisions shall continue in full force and effect. This Agreement constitutes the entire understanding between the Parties relative to the subject matter hereof.

  - type: "signature"
    signer_label: "EXECUTION & SIGNATURE OF RECORD"
    fields:
      - name: "signer_title"
        label: "Signer Title / Corporate Capacity"
        type: "text"
        required: true
        placeholder: "e.g., Chief Executive Officer, Managing Director, Authorized Representative"

      - name: "signature_timestamp"
        label: "Date & Timestamp of Execution"
        type: "datetime-auto"
        required: true
