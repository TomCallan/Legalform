<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace | Sig</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-base: #06080c;
      --bg-surface: #0f131a;
      --bg-sidebar: #0a0d14;
      --border-subtle: #1e2532;
      --border-active: #2c3647;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-brand: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.25);
    }
    
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
    body { background: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
    
    /* Login Screen */
    .auth-wrapper {
      position: fixed; inset: 0; background: var(--bg-base); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 3rem; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); text-align: center;
    }
    
    /* App Layout */
    .sidebar {
      width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle);
      display: flex; flex-direction: column; padding: 1.5rem;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.25rem; margin-bottom: 3rem; }
    .brand-mark { width: 32px; height: 32px; background: var(--text-main); color: var(--bg-base); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; border-radius: 6px; }
    
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-muted);
      border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem;
    }
    .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text-main); }
    .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent-brand); }
    
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 72px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; background: var(--bg-base);
    }
    .view-container { flex: 1; overflow-y: auto; padding: 2rem; }
    
    /* Buttons & Inputs */
    .btn { background: var(--text-main); color: var(--bg-base); border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #e2e8f0; transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-subtle); }
    .btn-outline:hover { background: var(--bg-surface); }
    
    input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--bg-surface); color: var(--text-main); font-size: 0.9rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent-brand); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group { margin-bottom: 1.5rem; }

    /* Builder Layout */
    .builder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; height: calc(100vh - 140px); }
    .builder-pane { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .pane-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-subtle); font-weight: 600; display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); }
    .pane-content { flex: 1; overflow-y: auto; padding: 1.5rem; }
    
    /* Code Editor */
    .code-editor { width: 100%; height: 100%; background: transparent; border: none; color: #a1a1aa; font-family: 'Fira Code', monospace; font-size: 0.85rem; resize: none; outline: none; line-height: 1.6; }
    
    /* Visual Canvas blocks */
    .block-card { background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; position: relative; }
    .block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .block-type { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .block-delete { color: var(--error); cursor: pointer; font-size: 0.8rem; font-weight: 500; }
    
    /* Ledger Table */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-subtle); font-size: 0.85rem; }
    th { font-weight: 600; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .status-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .status-active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .status-closed { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; }
    .modal-content { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 2rem; width: 400px; box-shadow: var(--shadow-lg); }
  </style>
</head>
<body>

  <!-- Auth -->
  <div id="auth-view" class="auth-wrapper">
    <div class="auth-box">
      <div class="brand-mark" style="margin: 0 auto 1.5rem; width: 48px; height: 48px; font-size: 1.5rem;">S</div>
      <h2 style="margin-bottom: 0.5rem; font-weight: 700;">Workspace Login</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Authenticate to manage your agreements.</p>
      <form onsubmit="handleLogin(event)">
        <input type="password" id="api-key" placeholder="Enter Workspace Key" required style="margin-bottom: 1rem; text-align: center;">
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div> Sig Workspace
    </div>
    <div class="nav-item active" id="nav-ledger" onclick="switchView('ledger')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      Documents
    </div>
    <div class="nav-item" id="nav-builder" onclick="switchView('builder')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      New Template
    </div>
    <div class="nav-item" onclick="createWorkspace()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      Create Workspace
    </div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="logout()" style="color:var(--error);">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
      Sign Out
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h2 id="view-title" style="font-size: 1.1rem; font-weight: 600;">Documents</h2>
      <div id="topbar-actions"></div>
    </div>
    
    <div class="view-container">
      <!-- Ledger View -->
      <div id="view-ledger">
        <table id="docs-table">
          <thead>
            <tr><th>Document ID</th><th>Status</th><th>Executions</th><th>Link</th><th>Actions</th></tr>
          </thead>
          <tbody id="docs-tbody"></tbody>
        </table>
      </div>

      <!-- Builder View -->
      <div id="view-builder" style="display:none;">
        <div class="builder-grid">
          <!-- Visual Pane -->
          <div class="builder-pane">
            <div class="pane-header">
              Visual Canvas
              <div style="display:flex;gap:0.5rem">
                <button class="btn btn-outline btn-sm" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="addVisualBlock('text')">+ Text</button>
                <button class="btn btn-outline btn-sm" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="addVisualBlock('form')">+ Form</button>
                <button class="btn btn-outline btn-sm" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="addVisualBlock('signature')">+ Sign</button>
              </div>
            </div>
            <div class="pane-content" id="visual-blocks">
              <div class="form-group">
                <label>Document Title</label>
                <input type="text" id="b-title" value="Mutual Non-Disclosure Agreement" oninput="syncToYaml()">
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:2rem;">
                <div class="form-group"><label>ID</label><input type="text" id="b-id" value="nda-001" oninput="syncToYaml()"></div>
                <div class="form-group"><label>Validity (Days)</label><input type="number" id="b-exp" value="30" oninput="syncToYaml()"></div>
              </div>
              <div id="blocks-container"></div>
            </div>
          </div>
          
          <!-- YAML Pane -->
          <div class="builder-pane">
            <div class="pane-header">
              YAML Source
              <button class="btn btn-sm" onclick="deploy()">Deploy Now</button>
            </div>
            <div class="pane-content" style="padding:0;">
              <textarea id="yaml-code" class="code-editor" style="padding:1.5rem;" spellcheck="false" oninput="syncFromYaml()"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="sys-modal">
    <div class="modal-content">
      <h3 id="mod-title" style="margin-bottom:1rem;font-weight:600;">Alert</h3>
      <p id="mod-body" style="color:var(--text-muted);font-size:0.9rem;line-height:1.5;margin-bottom:2rem;word-break:break-all;"></p>
      <div style="display:flex;justify-content:flex-end;gap:1rem;">
        <button class="btn btn-outline" id="mod-cancel" style="display:none;" onclick="closeModal(false)">Cancel</button>
        <button class="btn" id="mod-confirm" onclick="closeModal(true)">OK</button>
      </div>
    </div>
  </div>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8787' : 'https://legalform-api.tomcallan0.workers.dev';
const ORIGIN = window.location.origin;
let key = localStorage.getItem('WORKSPACE_KEY') || '';
let modalCb = null;

if (key) {
  document.getElementById('auth-view').style.display = 'none';
  loadLedger();
}

function handleLogin(e) {
  e.preventDefault();
  key = document.getElementById('api-key').value.trim();
  localStorage.setItem('WORKSPACE_KEY', key);
  document.getElementById('auth-view').style.display = 'none';
  loadLedger();
}
function logout() { localStorage.removeItem('WORKSPACE_KEY'); location.reload(); }

function switchView(view) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + view).classList.add('active');
  document.getElementById('view-ledger').style.display = view === 'ledger' ? 'block' : 'none';
  document.getElementById('view-builder').style.display = view === 'builder' ? 'block' : 'none';
  
  if (view === 'ledger') {
    document.getElementById('view-title').textContent = 'Documents';
    document.getElementById('topbar-actions').innerHTML = '<button class="btn btn-outline btn-sm" onclick="loadLedger()">Refresh</button>';
    loadLedger();
  } else {
    document.getElementById('view-title').textContent = 'New Template';
    document.getElementById('topbar-actions').innerHTML = '';
    if (document.getElementById('blocks-container').children.length === 0) initBuilder();
  }
}

async function createWorkspace() {
  const wsId = prompt("Enter a unique Workspace ID:");
  if (!wsId) return;
  const wsName = prompt("Enter Workspace Name:");
  if (!wsName) return;
  try {
    const res = await fetch(`${API}/api/workspaces`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({ id: wsId, name: wsName })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    alert(`Workspace created: ${data.workspace.name}`);
  } catch (e) {
    alert(`Failed to create workspace: ${e.message}`);
  }
}

function modal(title, body, confirm = false) {
  return new Promise(res => {
    document.getElementById('mod-title').textContent = title;
    document.getElementById('mod-body').innerHTML = body;
    document.getElementById('mod-cancel').style.display = confirm ? 'block' : 'none';
    document.getElementById('sys-modal').style.display = 'flex';
    modalCb = res;
  });
}
function closeModal(val) { document.getElementById('sys-modal').style.display = 'none'; if(modalCb) modalCb(val); }

async function loadLedger() {
  const tbody = document.getElementById('docs-tbody');
  try {
    const res = await fetch(\`\${API}/api/documents/list\`, { headers: { 'Authorization': \`Bearer \${key}\` } });
    if (res.status === 401) return logout();
    const { documents } = await res.json();
    
    tbody.innerHTML = documents.length ? documents.map(d => \`
      <tr>
        <td><strong>\${d.id}</strong><br><span style="font-size:0.75rem;color:var(--text-muted);font-family:monospace">\${d.slug}</span></td>
        <td><span class="status-badge \${d.status==='active'?'status-active':'status-closed'}">\${d.status}</span></td>
        <td>\${d.submission_count||0}</td>
        <td><a href="\${ORIGIN}/?slug=\${d.slug}" target="_blank" style="font-family:monospace;font-size:0.8rem">\${ORIGIN}/?slug=\${d.slug}</a></td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="revoke('\${d.slug}')">Revoke</button>
          <button class="btn btn-outline btn-sm" style="color:var(--error);border-color:rgba(239,68,68,0.3)" onclick="del('\${d.id}')">Del</button>
        </td>
      </tr>
    \`).join('') : '<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--text-muted);">No documents deployed yet.</td></tr>';
  } catch(e) { tbody.innerHTML = \`<tr><td colspan="5">Error: \${e.message}</td></tr>\`; }
}

async function revoke(slug) {
  if(await modal('Revoke Access', \`Deactivate \${slug}?\`, true)) {
    await fetch(\`\${API}/api/doc/\${slug}/close\`, {method:'POST', headers:{'Authorization':\`Bearer \${key}\`}}); loadLedger();
  }
}
async function del(id) {
  if(await modal('Delete Document', \`Purge \${id}?\`, true)) {
    await fetch(\`\${API}/api/doc/\${id}\`, {method:'DELETE', headers:{'Authorization':\`Bearer \${key}\`}}); loadLedger();
  }
}

function initBuilder() {
  addVisualBlock('text');
  addVisualBlock('signature');
  syncToYaml();
}

function addVisualBlock(type) {
  const container = document.getElementById('blocks-container');
  const div = document.createElement('div');
  div.className = 'block-card';
  div.dataset.type = type;
  
  let content = '';
  if (type === 'text') content = '<textarea style="width:100%;height:80px;background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-main);padding:0.75rem;border-radius:6px;resize:vertical;" oninput="syncToYaml()">## Terms\n</textarea>';
  if (type === 'signature') content = '<input type="text" value="Execution Block" oninput="syncToYaml()">';
  if (type === 'form') content = '<input type="text" placeholder="Field Label (e.g. Full Name)" value="Full Name" oninput="syncToYaml()">';
  
  div.innerHTML = \`
    <div class="block-header">
      <div class="block-type">\${type} Block</div>
      <div class="block-delete" onclick="this.parentElement.parentElement.remove(); syncToYaml()">Remove</div>
    </div>
    \${content}
  \`;
  container.appendChild(div);
}

function syncToYaml() {
  const doc = {
    id: document.getElementById('b-id').value,
    title: document.getElementById('b-title').value,
    expires_in_days: parseInt(document.getElementById('b-exp').value) || 30,
    signing_order: 'sequential'
  };
  
  const sections = Array.from(document.getElementById('blocks-container').children).map(b => {
    const type = b.dataset.type;
    if (type === 'text') return { type: 'static', content: b.querySelector('textarea').value };
    if (type === 'signature') return { type: 'signature', signer_label: b.querySelector('input').value, fields: [{name:"date", type:"datetime-auto", required:true}] };
    if (type === 'form') return { type: 'form', fields: [{name:"field1", label: b.querySelector('input').value, type:"text", required:true}] };
  });

  const spec = { document: doc, parties: [{id:"signer1", role:"Primary Signer", sequence:1}], sections };
  document.getElementById('yaml-code').value = jsyaml.dump(spec, { sortKeys: false });
}

function syncFromYaml() {
  try {
    const spec = jsyaml.load(document.getElementById('yaml-code').value);
    if(spec.document) {
      document.getElementById('b-id').value = spec.document.id || '';
      document.getElementById('b-title').value = spec.document.title || '';
      document.getElementById('b-exp').value = spec.document.expires_in_days || 30;
    }
  } catch(e) {} // ignore partial yaml parse errors while typing
}

async function deploy() {
  try {
    const spec = jsyaml.load(document.getElementById('yaml-code').value);
    if (!spec.document?.id) throw new Error("Missing document ID");
    
    const slug = Math.random().toString(36).substring(2, 14);
    const payload = {
      id: spec.document.id, slug, spec: JSON.stringify(spec),
      expires_at: Math.floor(Date.now()/1000) + ((spec.document.expires_in_days||30) * 86400),
      max_per_email: 99, max_per_ip: 99, require_verification: 0
    };
    
    const res = await fetch(\`\${API}/api/documents\`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': \`Bearer \${key}\` },
      body: JSON.stringify(payload)
    });
    
    if(!res.ok) throw new Error((await res.json()).error);
    
    await modal('Deployed Successfully', \`Link: <br><a href="\${ORIGIN}/?slug=\${slug}" target="_blank">\${ORIGIN}/?slug=\${slug}</a>\`);
    switchView('ledger');
  } catch(e) { modal('Deploy Failed', e.message); }
}
</script>
</body>
</html>
