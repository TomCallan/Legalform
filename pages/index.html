<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Legalform - Cryptographic Legal Agreements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #ffffff;
      --bg-surface: #fafafa;
      --bg-surface-hover: #f5f5f5;
      --border-subtle: #e5e5e5;
      --border-active: #000000;
      --text-main: #000000;
      --text-muted: #6e6e73;
      --accent-brand: #000000;
      --success: #0f7b3d;
      --error: #c02424;
    }
    * { box-sizing: border-box; font-family: 'Zen Kaku Gothic New', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent-brand); text-decoration: none; transition: color 0.2s; }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 clamp(12px, 3vw, 32px);
      width: 100%;
    }
    
    header {
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-base);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 64px;
      padding: 0.5rem 0;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    /* Mobile Responsive Rules */
    @media (max-width: 640px) {
      .container { padding: 0 12px; }
      .header-inner { padding: 0.75rem 0; flex-direction: column; align-items: flex-start; gap: 0.4rem; }
      .brand { margin-left: 12px; }
      .signer-wrapper { padding: 1rem 0 2rem; }
      .signer-head { padding: 1.25rem 1rem; }
      .signer-body { padding: 1.25rem 1rem; }
      .signer-title { font-size: 1.5rem; margin-bottom: 0.75rem; }
      .signer-section { margin-bottom: 1.75rem; }
      .btn { width: 100%; padding: 0.75rem 1rem; font-size: 0.8rem; }
      .sig-pad { height: 160px; }
      .sig-actions { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
      .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
    }
    
    .btn {
      background: var(--text-main);
      color: var(--bg-base);
      padding: 0.8rem 2rem;
      border-radius: 0;
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .btn:hover { background: var(--bg-base); color: var(--text-main); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }
    .btn-outline:hover { background: var(--bg-surface); border-color: var(--text-main); color: var(--text-main); }

    /* Signer Flow */
    .signer-wrapper {
      padding: clamp(32px, 6vh, 72px) 0 4rem;
    }
    .signer-card {
      border: 1px solid var(--border-subtle);
      background: var(--bg-base);
    }
    .signer-head {
      padding: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .signer-eyebrow {
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .signer-title {
      font-size: clamp(22px, 3.2vw, 38px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text-main);
      margin: 0 0 1.25rem;
    }
    .signer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 2rem;
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .signer-body { padding: 2rem; }
    .signer-section { margin-bottom: 2.5rem; }
    .signer-section:last-child { margin-bottom: 0; }
    
    .section-label {
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .static-body p {
      margin: 0 0 1rem;
      font-size: clamp(13px, 0.95vw, 15px);
      line-height: 1.7;
      color: var(--text-main);
    }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block;
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .form-control {
      width: 100%;
      background: var(--bg-surface-hover);
      border: 1px solid transparent;
      padding: 0.8rem 1rem;
      font-family: inherit;
      font-size: clamp(13px, 0.95vw, 15px);
      color: var(--text-main);
      outline: none;
      border-radius: 0;
      transition: all 0.2s;
    }
    .form-control:focus {
      background: var(--bg-base);
      border-color: var(--border-active);
    }
    .form-control[readonly] { cursor: default; }
    
    .legal-footer {
      margin: 2rem 0;
      padding: 1.25rem 0;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      font-size: clamp(13px, 0.95vw, 15px);
      line-height: 1.6;
      color: var(--text-main);
    }
    
    .sig-pad {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      width: 100%;
      height: 200px;
      display: block;
      touch-action: none;
      cursor: crosshair;
      border-radius: 0;
    }
    .sig-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }
    .sig-hint {
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .btn-danger-ghost {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      padding: 0.5rem 1rem;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 0;
      transition: all 0.2s;
    }
    .btn-danger-ghost:hover { background: var(--error); color: var(--bg-base); }

    .audit-row {
      border-top: 1px solid var(--border-subtle);
      padding-top: 1.5rem;
      margin-top: 2rem;
      font-variant-numeric: tabular-nums;
    }
    .audit-hash {
      font-size: clamp(10px, 0.75vw, 12px);
      color: var(--text-main);
      letter-spacing: 0.04em;
      word-break: break-all;
      overflow-wrap: anywhere;
      line-height: 1.6;
      margin-top: 0.5rem;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 0.6rem 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    footer {
      margin-top: auto;
      border-top: 1px solid var(--border-subtle);
      padding: 1.5rem 0;
      color: var(--text-muted);
      font-size: clamp(9px, 0.7vw, 11px);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="/" onclick="navigateTo(event, 'verify')" class="brand">
        Legalform
      </a>
      <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
        <a href="/verify" onclick="navigateTo(event, 'verify')" id="verify-link" style="font-size: clamp(11px, 0.8vw, 13px); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-main);">
          Verify Audit
        </a>
        <span style="color: var(--border-subtle);">|</span>
        <a href="/dashboard" onclick="navigateTo(event, 'dashboard')" id="dashboard-link" style="font-size: clamp(11px, 0.8vw, 13px); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-main);">
          Sender Ledger
        </a>
      </div>
    </div>
  </header>

  <main id="app">
    <div class="container signer-wrapper">
      <div class="signer-card" id="main-content">
        <div style="padding: 4rem; text-align: center;">
          <div class="section-label">Loading Document</div>
          <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); margin: 0;">Fetching cryptographic signature record...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      LEGALFORM — MONARCH DESIGN SYSTEM • COURT-ENFORCEABLE SIGNATURE INFRASTRUCTURE
    </div>
  </footer>

<script src="builder.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const isPagesDev = window.location.hostname.includes('pages.dev');
const isLocalProxy = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '8080';
const DEFAULT_API_BASE = (isPagesDev || !isLocalProxy)
  ? 'https://legalform-api.tomcallan0.workers.dev'
  : '';
const API_BASE = window.LEGALFORM_API_BASE || params.get('api_base') || localStorage.getItem('LEGALFORM_API_BASE') || DEFAULT_API_BASE;
const slug = params.get('slug') || '';

const queryPrefills = {};
for (const [key, val] of params.entries()) {
  if (key !== 'slug' && key !== 'api_base' && key !== 'dashboard' && key !== 'verify') {
    queryPrefills[key] = val;
  }
}

const DASHBOARD_AUTH_HASH = 'ed27cc4da76834c9eb5bd7c29e4b6001d93a7dc800323beaaa49ebda91361e08';
const DASHBOARD_AUTH_KEY = 'legalform_dashboard_unlocked';

function isDashboardUnlocked() {
  return sessionStorage.getItem(DASHBOARD_AUTH_KEY) === '1';
}

function navigateTo(e, route) {
  if (e && e.preventDefault) e.preventDefault();
  if (route === 'dashboard') {
    if (isDashboardUnlocked()) {
      renderDashboard();
    } else {
      renderAuthGate();
    }
  } else if (route === 'verify') {
    renderVerifyPage();
  }
}

function lockDashboard() {
  sessionStorage.removeItem(DASHBOARD_AUTH_KEY);
  renderVerifyPage();
  showToast('Sender ledger locked.', 'info');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function safeFetchJson(url, options) {
  let res;
  try {
    res = await fetch(url, options);
  } catch (netErr) {
    const err = new Error(`Network error connecting to backend (${url}): ${netErr.message}`);
    err.isNetwork = true;
    throw err;
  }

  const contentType = res.headers.get('content-type') || '';
  const text = await res.text();

  if (text.trim().startsWith('<') || contentType.includes('text/html')) {
    if (res.status === 403) {
      const err = new Error('Access Denied (HTTP 403): Cloudflare firewall or WAF blocked access to this API route.');
      err.status = 403;
      throw err;
    }
    if (res.status === 404) {
      const err = new Error('API Endpoint Not Found (HTTP 404): Cloudflare Pages served static HTML instead of Worker API. Ensure Worker routing is configured or pass ?api_base=URL.');
      err.status = 404;
      throw err;
    }
    const err = new Error(`API returned HTML instead of expected JSON (HTTP ${res.status}). Verify Cloudflare Worker deployment or API_BASE configuration.`);
    err.status = res.status;
    throw err;
  }

  let data;
  try {
    data = JSON.parse(text);
  } catch (parseErr) {
    const err = new Error(`Invalid JSON response (HTTP ${res.status}): ${text.slice(0, 120)}`);
    err.status = res.status;
    throw err;
  }

  if (!res.ok) {
    const msg = data.error || data.message || `Server returned error status ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }

  return data;
}

function showToast(message, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }

  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');

  const label = document.createElement('div');
  label.textContent = type === 'error' ? '[ERROR]' : type === 'success' ? '[SUCCESS]' : '[NOTICE]';

  const close = document.createElement('button');
  close.className = 'toast-close';
  close.setAttribute('aria-label', 'Dismiss notification');
  close.textContent = 'DISMISS';
  close.style.fontSize = '9px';
  close.style.letterSpacing = '0.1em';
  close.style.fontWeight = '700';
  close.addEventListener('click', () => dismissToast(el));

  const head = document.createElement('div');
  head.className = 'toast-head';
  head.appendChild(label);
  head.appendChild(close);

  const msg = document.createElement('div');
  msg.className = 'toast-msg';
  msg.textContent = message;

  el.appendChild(head);
  el.appendChild(msg);
  container.appendChild(el);

  setTimeout(() => dismissToast(el), type === 'error' ? 7000 : 4000);
}

function dismissToast(el) {
  if (!el || el.dataset.dismissed) return;
  el.dataset.dismissed = '1';
  el.classList.add('toast-leave');
  setTimeout(() => el.remove(), 240);
}

async function sha256Hex(input) {
  const bytes = new TextEncoder().encode(input);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function loadDocument() {
  const container = document.getElementById('main-content');

  // If slug is provided in URL, load document for signing
  if (slug) {
    try {
      const doc = await safeFetchJson(`${API_BASE}/api/doc/${slug}`);
      const spec = typeof doc.spec === 'string' ? JSON.parse(doc.spec) : doc.spec;
      renderSigner(doc, spec);
      return;
    } catch (err) {
      const is403 = err.status === 403 || (err.message && err.message.toLowerCase().includes('access denied'));
      const titleText = is403 ? 'Access Denied' : 'Unable to Load Document';
      container.innerHTML = `
        <div style="padding: 3rem;">
          <div style="color: var(--error); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: clamp(12px, 1vw, 15px); margin-bottom: 0.75rem;">${esc(titleText)}</div>
          <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); margin: 0; line-height: 1.5;">${esc(err.message)}</p>
          <div style="margin-top: 1.5rem;">
            <button onclick="renderVerifyPage()" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">Return to Cryptographic Verification</button>
          </div>
        </div>`;
      return;
    }
  }

  // If dashboard route explicitly requested
  if (window.location.pathname.startsWith('/dashboard') || params.has('dashboard')) {
    if (isDashboardUnlocked()) {
      renderDashboard();
    } else {
      renderAuthGate();
    }
    return;
  }

  // Default flow (unauthenticated root / verify): always render the verify tool
  renderVerifyPage();
}

function renderAuthGate() {
  const container = document.getElementById('main-content');
  container.innerHTML = `
    <div class="signer-head">
      <div class="signer-eyebrow">Sender Management Ledger</div>
      <h1 class="signer-title">Restricted Access</h1>
      <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); margin: 0; line-height: 1.6;">Enter administrative passcode to unlock sender document ledger, visual builder, and submissions.</p>
    </div>
    <div class="signer-body">
      <div class="form-group" style="max-width: 380px;">
        <label for="auth-passcode">Sender Passcode</label>
        <input id="auth-passcode" type="password" class="form-control" placeholder="Enter administrative passcode" autocomplete="current-password" />
      </div>
      <div style="margin-top: 1.25rem;">
        <button id="auth-submit" class="btn">Unlock Ledger</button>
      </div>
      <div id="auth-error" style="color: var(--error); font-size: 0.85rem; font-weight: 600; margin-top: 1rem; display: none; text-transform: uppercase; letter-spacing: 0.08em;">Incorrect passcode. Access denied.</div>
    </div>`;

  const input = document.getElementById('auth-passcode');
  const error = document.getElementById('auth-error');
  const attempt = async () => {
    const val = input.value.trim();
    if (!val) return;
    const computed = await sha256Hex(val);
    if (computed === DASHBOARD_AUTH_HASH) {
      sessionStorage.setItem(DASHBOARD_AUTH_KEY, '1');
      renderDashboard();
    } else {
      error.style.display = 'block';
      input.value = '';
      input.focus();
    }
  };

  document.getElementById('auth-submit').addEventListener('click', attempt);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
  input.focus();
}

function renderVerifyPage() {
  const container = document.getElementById('main-content');
  container.innerHTML = `
    <div class="signer-head">
      <div class="signer-eyebrow">Cryptographic Audit Tool</div>
      <h1 class="signer-title">Verify SHA-256 Signature</h1>
      <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); margin: 0;">Verify document integrity, check SHA-256 hash digests, or inspect executed JSON agreement files.</p>
    </div>
    <div class="signer-body">
      <div class="form-group">
        <label>Verification Method</label>
        <div style="display:flex; gap:1.25rem; margin-bottom: 1rem; flex-wrap:wrap;">
          <label style="cursor:pointer; text-transform:none; letter-spacing:normal;"><input type="radio" name="verify-mode" value="hash" checked onchange="toggleVerifyMode()"> SHA-256 Digest Hash</label>
          <label style="cursor:pointer; text-transform:none; letter-spacing:normal;"><input type="radio" name="verify-mode" value="file" onchange="toggleVerifyMode()"> Submission JSON File</label>
          <label style="cursor:pointer; text-transform:none; letter-spacing:normal;"><input type="radio" name="verify-mode" value="text" onchange="toggleVerifyMode()"> Plain Text Content</label>
        </div>
      </div>

      <div id="mode-hash-sec" class="form-group">
        <label>SHA-256 Hash Digest</label>
        <input type="text" id="verify-hash-input" class="form-control" placeholder="Enter 64-character SHA-256 hash string">
      </div>

      <div id="mode-file-sec" class="form-group" style="display:none;">
        <label>Executed JSON Document Payload</label>
        <input type="file" id="verify-file-input" accept=".json" class="form-control" style="background:var(--bg-base); border:1px solid var(--border-subtle);">
      </div>

      <div id="mode-text-sec" class="form-group" style="display:none;">
        <label>Document Raw Text Content</label>
        <textarea id="verify-text-input" class="form-control" rows="6" placeholder="Paste raw document content here..."></textarea>
        <div style="margin-top: 0.75rem;">
          <label>Expected SHA-256 Hash (Optional)</label>
          <input type="text" id="verify-expected-hash" class="form-control" placeholder="Optional hash to compare against">
        </div>
      </div>

      <div style="margin-top: 1.5rem;">
        <button onclick="performVerification()" class="btn" style="width:100%;">
          Verify Signature & Document Integrity
        </button>
      </div>

      <div id="verify-result" style="margin-top: 1.5rem;"></div>
    </div>
  `;
}

function toggleVerifyMode() {
  const mode = document.querySelector('input[name="verify-mode"]:checked').value;
  document.getElementById('mode-hash-sec').style.display = mode === 'hash' ? 'block' : 'none';
  document.getElementById('mode-file-sec').style.display = mode === 'file' ? 'block' : 'none';
  document.getElementById('mode-text-sec').style.display = mode === 'text' ? 'block' : 'none';
  document.getElementById('verify-result').innerHTML = '';
}

async function performVerification() {
  const resultDiv = document.getElementById('verify-result');
  const mode = document.querySelector('input[name="verify-mode"]:checked').value;
  resultDiv.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.12em;">Computing cryptographic audit verification...</p>`;

  try {
    let body = {};
    if (mode === 'hash') {
      const hashVal = document.getElementById('verify-hash-input').value.trim();
      if (!hashVal) throw new Error('Please enter a SHA-256 hash string.');
      body.hash = hashVal;
    } else if (mode === 'file') {
      const fileInput = document.getElementById('verify-file-input');
      if (!fileInput.files || !fileInput.files[0]) throw new Error('Please select a JSON file.');
      const fileText = await fileInput.files[0].text();
      body.payload = JSON.parse(fileText);
    } else if (mode === 'text') {
      const textVal = document.getElementById('verify-text-input').value;
      const expectedHash = document.getElementById('verify-expected-hash').value.trim();
      if (!textVal) throw new Error('Please paste raw text content.');
      body.text = textVal;
      if (expectedHash) body.hash = expectedHash;
    }

    let data;
    try {
      data = await safeFetchJson(`${API_BASE}/api/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } catch (apiErr) {
      if (mode === 'text') {
        const textVal = document.getElementById('verify-text-input').value;
        const expectedHash = document.getElementById('verify-expected-hash').value.trim();
        const computed = await sha256Hex(textVal);
        const matches = expectedHash ? computed.toLowerCase() === expectedHash.toLowerCase() : true;
        data = {
          valid: matches,
          calculated_hash: computed,
          message: matches ? 'SHA-256 hash matches text content (client-side computed).' : 'SHA-256 hash mismatch for text content.'
        };
      } else {
        throw apiErr;
      }
    }

async function deploySpecObject(spec) {
  if (!spec || typeof spec !== 'object' || !spec.document || !spec.document.id) {
    throw new Error('Spec must include a top-level document key with an id.');
  }
  const docId = String(spec.document.id);
  const slug = (await sha256Hex(`${docId}-${new Date().toISOString()}`)).slice(0, 12);
  const expiresDays = Number(spec.document.expires_in_days || 30);
  const expiresAt = Math.floor(Date.now() / 1000) + expiresDays * 86400;

  const data = await safeFetchJson(`${API_BASE}/api/documents`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: docId, slug, spec, expires_at: expiresAt })
  });
  const signLink = `${window.location.origin}/?slug=${data.slug}`;

  await renderDashboard();
  const result = document.getElementById('deploy-result');
  if (result) {
    result.innerHTML = `
      <div style="border:1px solid var(--border-subtle); border-radius:0; padding:0.85rem; background:var(--bg-base); font-size:0.8rem;">
        <div style="color: var(--success); font-weight:600; margin-bottom:0.5rem; text-transform: uppercase; letter-spacing: 0.1em;">STATUS: DEPLOYED — DOCUMENT ID: ${esc(data.id)}</div>
        <div style="color:var(--text-muted); margin-bottom:0.25rem;">Shareable signing link:</div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
          <code style="word-break:break-all; color:var(--text-main);">${esc(signLink)}</code>
          <button class="btn btn-outline" style="padding:0.25rem 0.6rem; font-size:0.7rem;" onclick="navigator.clipboard.writeText('${esc(signLink)}')">Copy</button>
        </div>
      </div>`;
  }
  return data;
}

function bindDeployPanel() {
  const btn = document.getElementById('deploy-btn');
  const textarea = document.getElementById('deploy-spec');
  const status = document.getElementById('deploy-status');
  const result = document.getElementById('deploy-result');

  const tabBuilder = document.getElementById('tab-builder');
  const tabYaml = document.getElementById('tab-yaml');
  const paneBuilder = document.getElementById('deploy-builder-pane');
  const paneYaml = document.getElementById('deploy-yaml-pane');

  if (tabBuilder && tabYaml && paneBuilder && paneYaml) {
    tabBuilder.addEventListener('click', () => {
      tabBuilder.classList.add('active');
      tabYaml.classList.remove('active');
      paneBuilder.style.display = '';
      paneYaml.style.display = 'none';
    });
    tabYaml.addEventListener('click', () => {
      tabYaml.classList.add('active');
      tabBuilder.classList.remove('active');
      paneBuilder.style.display = 'none';
      paneYaml.style.display = '';
    });
    if (window.LegalFormBuilder && typeof window.LegalFormBuilder.mount === 'function') {
      window.LegalFormBuilder.mount(paneBuilder);
    }
  }

  if (!btn || !textarea) return;

  btn.addEventListener('click', async () => {
    status.textContent = 'Parsing & deploying spec...';
    result.innerHTML = '';
    btn.disabled = true;

    try {
      const spec = typeof window.jsyaml !== 'undefined'
        ? window.jsyaml.load(textarea.value)
        : JSON.parse(textarea.value);

      await deploySpecObject(spec);
      status.textContent = '';
      textarea.value = '';
    } catch (err) {
      status.textContent = '';
      result.innerHTML = `<div style="color: var(--error); font-size:0.8rem; margin-top:0.5rem;">Deploy failed: ${esc(err.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });
}

async function downloadSubPdf(payloadStr, subShortId) {
  try {
    const res = await fetch(`${API_BASE}/api/render-pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payloadStr
    });
    if (!res.ok) throw new Error('PDF compilation failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `executed-agreement-${subShortId}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(err) {
    showToast(`PDF download error: ${err.message}`, 'error');
  }
}

async function exportDocData(docId) {
  try {
    const data = await safeFetchJson(`${API_BASE}/api/export/${docId}`);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `export-${docId}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    showToast(`Export failed: ${err.message}`, 'error');
  }
}

async function revokeDocument(slug) {
  if (!confirm('Are you sure you want to revoke this document? Signers will no longer be able to submit.')) return;
  try {
    await safeFetchJson(`${API_BASE}/api/doc/${slug}/close`, { method: 'POST' });
    showToast('Document revoked successfully.', 'success');
    renderDashboard();
  } catch (err) {
    showToast(`Revocation failed: ${err.message}`, 'error');
  }
}

async function restartDocument(slug) {
  try {
    await safeFetchJson(`${API_BASE}/api/doc/${slug}/restart`, { method: 'POST' });
    showToast('Document sharing restarted.', 'success');
    renderDashboard();
  } catch (err) {
    showToast(`Restart failed: ${err.message}`, 'error');
  }
}

async function deleteDocument(docId, slug) {
  const confirmed = confirm(
    `Permanently delete document "${docId}"?\n\n` +
    `This will purge the document spec and ALL associated submissions from the ledger.\n\n` +
    `This action CANNOT be undone.`
  );
  if (!confirmed) return;

  const doubleConfirm = prompt(`Type "${docId}" to confirm permanent deletion:`);
  if (doubleConfirm !== docId) {
    showToast('Deletion cancelled — confirmation text did not match.', 'info');
    return;
  }

  try {
    try {
      await safeFetchJson(`${API_BASE}/api/documents/${encodeURIComponent(docId)}`, { method: 'DELETE' });
    } catch (routeErr) {
      if (routeErr.status === 404 && slug) {
        await safeFetchJson(`${API_BASE}/api/doc/${slug}`, { method: 'DELETE' });
      } else {
        throw routeErr;
      }
    }
    showToast(`Document "${docId}" and all submissions deleted.`, 'success');
    renderDashboard();
  } catch (err) {
    showToast(`Delete failed: ${err.message}`, 'error');
  }
}

async function editDocument(docId) {
  let data;
  try {
    data = await safeFetchJson(`${API_BASE}/api/export/${docId}`);
  } catch (err) {
    showToast(`Could not load document: ${err.message}`, 'error');
    return;
  }
  const spec = typeof data.spec === 'string' ? JSON.parse(data.spec) : data.spec;
  if (!spec) {
    showToast('Document has no spec attached to edit.', 'error');
    return;
  }

  const tabYaml = document.getElementById('tab-yaml');
  const tabBuilder = document.getElementById('tab-builder');
  const paneYaml = document.getElementById('deploy-yaml-pane');
  const paneBuilder = document.getElementById('deploy-builder-pane');
  const textarea = document.getElementById('deploy-spec');

  if (tabYaml && tabBuilder && paneYaml && paneBuilder && textarea) {
    const yamlStr = typeof window.jsyaml !== 'undefined'
      ? window.jsyaml.dump(spec, { indent: 2, lineWidth: -1 })
      : JSON.stringify(spec, null, 2);

    textarea.value = yamlStr;
    tabYaml.classList.add('active');
    tabBuilder.classList.remove('active');
    paneBuilder.style.display = 'none';
    paneYaml.style.display = '';

    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast(`Loaded "${docId}" into the deploy editor. Modify the spec and click Deploy Document to publish changes.`, 'info');
  }
}

function renderStaticBody(content) {
  const lines = String(content ?? '').split('\n');
  const parts = [];
  let para = [];
  const flush = () => {
    if (para.length) { parts.push(`<p>${para.join('<br>')}</p>`); para = []; }
  };
  for (const raw of lines) {
    if (raw.startsWith('## ')) {
      flush();
      parts.push(`<h2 class="static-heading">${esc(raw.slice(3))}</h2>`);
    } else if (raw.trim() === '') {
      flush();
    } else {
      para.push(esc(raw));
    }
  }
  flush();
  return parts.join('');
}

      html += `
        <div class="signer-section">
          <div class="static-body">${renderStaticBody(sec.content)}</div>
        </div>`;
    } else if (sec.type === 'form' || sec.type === 'signature') {
      html += `<div class="signer-section">`;
      if (sec.signer_label) {
        html += `<div class="section-label">${esc(sec.signer_label)}</div>`;
      }
      
      (sec.fields || []).forEach(f => {
        const defaultVal = queryPrefills[f.name] ?? f.value ?? '';
        formValues[f.name] = defaultVal;

        if (f.type === 'checkbox') {
          formValues[f.name] = (defaultVal === true || defaultVal === 'true' || defaultVal === 'Yes') ? 'Yes' : 'No';
          html += `
            <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
              <input type="checkbox" 
                     id="field-${esc(f.name)}" 
                     data-field="${esc(f.name)}" 
                     ${formValues[f.name] === 'Yes' ? 'checked' : ''} 
                     style="width:1.2rem; height:1.2rem; cursor:pointer;" 
                     ${f.required ? 'required' : ''}>
              <label for="field-${esc(f.name)}" style="margin-bottom:0; cursor:pointer;">${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
            </div>`;
        } else if (f.type === 'radio' && Array.isArray(f.options)) {
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <div style="display:flex; flex-direction:column; gap:0.5rem;">
                ${f.options.map(opt => `
                  <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; text-transform:none; letter-spacing:normal;">
                    <input type="radio" 
                           name="field-${esc(f.name)}" 
                           data-field="${esc(f.name)}" 
                           value="${esc(opt)}" 
                           ${String(defaultVal) === String(opt) ? 'checked' : ''} 
                           ${f.required ? 'required' : ''}>
                    <span>${esc(opt)}</span>
                  </label>
                `).join('')}
              </div>
            </div>`;
        } else if (f.type === 'select' && Array.isArray(f.options)) {
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <select class="form-control" data-field="${esc(f.name)}" ${f.required ? 'required' : ''}>
                <option value="">-- Select an option --</option>
                ${f.options.map(o => `<option value="${esc(o)}" ${String(defaultVal) === String(o) ? 'selected' : ''}>${esc(o)}</option>`).join('')}
              </select>
            </div>`;
        } else if (f.type === 'textarea') {
          const textRows = f.rows || 6;
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <textarea class="form-control" data-field="${esc(f.name)}" rows="${textRows}" style="min-height:${textRows * 1.7}em; resize:vertical;" ${f.required ? 'required' : ''}>${esc(defaultVal)}</textarea>
            </div>`;
        } else {
          const isReadOnly = f.type === 'datetime-auto' ? 'readonly' : '';
          const inputType = f.type === 'email' ? 'email' : f.type === 'datetime' ? 'datetime-local' : f.type === 'date' ? 'date' : 'text';
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <input type="${inputType}" 
                     class="form-control" 
                     data-field="${esc(f.name)}" 
                     value="${esc(defaultVal)}" 
                     ${isReadOnly} 
                     ${f.required ? 'required' : ''}>
            </div>`;
        }
      });

      if (sec.type === 'signature') {
        if (d.legal_footer) {
          html += `<p class="legal-footer">${esc(d.legal_footer)}</p>`;
        }
        html += `
          <div class="form-group">
            <label>Signature *</label>
            <div class="sig-mode">
              <button type="button" class="sig-mode-btn active" data-sigmode="draw">Draw</button>
              <button type="button" class="sig-mode-btn" data-sigmode="type">Type</button>
            </div>
            <div id="sig-draw-pane">
              <canvas id="signature-canvas" class="sig-pad"></canvas>
              <div class="sig-actions">
                <span class="sig-hint">Sign inside box using mouse or touch</span>
                <button type="button" class="btn-danger-ghost" id="clear-sig">Clear</button>
              </div>
            </div>
            <div id="sig-type-pane" style="display:none;">
              <input type="text" id="sig-type-input" class="form-control sig-type-input" placeholder="Type your full legal name" autocomplete="name" />
              <span class="sig-hint">Your typed name is recorded as your signature</span>
            </div>
          </div>`;
      }
      html += `</div>`;
    }
  });

  html += `
      <div style="margin-top: 2rem;">
        <button id="submit-btn" class="btn" style="width:100%; padding:0.9rem 2rem;">
          Sign & Execute
        </button>
      </div>
    </div>
  `;

  container.innerHTML = html;

  container.querySelectorAll('input[data-field], select[data-field], textarea[data-field]').forEach(input => {
    const fn = e => {
      const fieldName = e.target.dataset.field;
      if (e.target.type === 'checkbox') {
        formValues[fieldName] = e.target.checked ? 'Yes' : 'No';
      } else {
        formValues[fieldName] = e.target.value;
      }
    };
    input.addEventListener('input', fn);
    input.addEventListener('change', fn);

    // Record typing additions / deletions for interaction telemetry
    input.addEventListener('keydown', e => {
      const fieldName = e.target.dataset.field;
      if (e.key === 'Backspace' || e.key === 'Delete') {
        interactionLogs.push({ field: fieldName, type: 'delete', key: e.key, ts: Date.now() });
      } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        interactionLogs.push({ field: fieldName, type: 'add', char: e.key, ts: Date.now() });
      }
    });

    // Record paste events
    input.addEventListener('paste', e => {
      const fieldName = e.target.dataset.field;
      const pastedData = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      interactionLogs.push({ field: fieldName, type: 'paste', length: pastedData.length, ts: Date.now() });
    });
  });

  const canvas = document.getElementById('signature-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let strokes = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#000000';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    resizeCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    const startDraw = e => { isDrawing = true; strokes++; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const draw = e => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const stopDraw = () => { isDrawing = false; };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    document.getElementById('clear-sig').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes = 0;
    });

    sigPadInit = {
      hasSignature: () => strokes > 0,
      toSVG: () => canvas.toDataURL()
    };
  }

  let sigMode = 'draw';
  const modeBtns = container.querySelectorAll('[data-sigmode]');
  const drawPane = document.getElementById('sig-draw-pane');
  const typePane = document.getElementById('sig-type-pane');
  const typeInput = document.getElementById('sig-type-input');
  if (modeBtns.length) {
    modeBtns.forEach(b => b.addEventListener('click', () => {
      sigMode = b.dataset.sigmode;
      modeBtns.forEach(x => x.classList.toggle('active', x === b));
      if (drawPane) drawPane.style.display = sigMode === 'draw' ? '' : 'none';
      if (typePane) typePane.style.display = sigMode === 'type' ? '' : 'none';
    }));
  }

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const btn = document.getElementById('submit-btn');
    if (sigMode === 'draw') {
      if (sigPadInit && !sigPadInit.hasSignature()) {
        btn.textContent = 'Signature required';
        setTimeout(() => { btn.textContent = 'Sign & Execute'; }, 2000);
        return;
      }
    } else if (!typeInput || !typeInput.value.trim()) {
      btn.textContent = 'Type your signature first';
      setTimeout(() => { btn.textContent = 'Sign & Execute'; }, 2000);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Recording Execution...';

    try {
      const payload = {
        fields: formValues,
        signature_data: sigMode === 'type'
          ? (typeInput ? typeInput.value.trim() : '')
          : (sigPadInit ? sigPadInit.toSVG() : ''),
        interaction_logs: interactionLogs
      };

      const result = await safeFetchJson(`${API_BASE}/api/submit/${slug}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      renderSuccess(doc, result);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Sign & Execute';
    }
  });
}

function renderSuccess(doc, result) {
  const container = document.getElementById('main-content');
  const payloadJson = JSON.stringify(result.payload, null, 2);

  container.innerHTML = `
    <div class="signer-head">
      <div class="signer-eyebrow" style="color: var(--success);">Execution Recorded</div>
      <h1 class="signer-title">Document Signed</h1>
      <p style="margin: 0; color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); line-height: 1.6;">${esc(doc.id)} — execution complete. Agreement cryptographically recorded.</p>
    </div>
    <div class="signer-body">
      <div class="signer-meta" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;">
        <span>Submission ID ${esc(result.submission_id)}</span>
      </div>
      <div class="audit-row">
        <div class="section-label">Cryptographic Audit — SHA-256 Digest</div>
        <div class="audit-hash">${esc(result.audit_hash)}</div>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:1rem; margin-top:2rem;">
        <button id="download-pdf-btn" class="btn">
          Download Signed PDF
        </button>
        <button id="download-json-btn" class="btn btn-outline">
          Export Compact JSON
        </button>
      </div>
    </div>
  `;

  document.getElementById('download-pdf-btn').addEventListener('click', async () => {
    const btn = document.getElementById('download-pdf-btn');
    btn.disabled = true;
    btn.textContent = 'Generating PDF...';
    try {
      const res = await fetch(`${API_BASE}/api/render-pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payloadJson
      });
      if (!res.ok) throw new Error('PDF compilation failed');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `executed-agreement-${result.submission_id.slice(0, 8)}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Download Signed PDF';
    }
  });

  document.getElementById('download-json-btn').addEventListener('click', () => {
    const blob = new Blob([payloadJson], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `signed-document-${result.submission_id.slice(0, 8)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

loadDocument();
</script>
</body>
</html>
