<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>LegalForm - Developer-First eSignatures & Agreements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app:        #090d16;
      --bg-card:       #111726;
      --bg-input:      #1a2234;
      --border-subtle: #1e293b;
      --border-active: #334155;
      --text-primary:  #f8fafc;
      --text-muted:    #64748b;
      --text-subtle:   #94a3b8;
      --accent-brand:  #3b82f6;
      --accent-hover:  #2563eb;
    }
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    header {
      border-bottom: 1px solid var(--border-subtle);
      padding: 1.25rem 0;
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-brand), #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #ffffff;
      font-size: 1.1rem;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.3);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .btn {
      background: var(--accent-brand);
      color: #ffffff;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent-hover); text-decoration: none; transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    
    .hero {
      text-align: center;
      padding: 5rem 0 4rem 0;
    }
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #60a5fa;
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }
    .hero h1 {
      font-size: 3.25rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin: 0 0 1.25rem 0;
    }
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 1.15rem;
      color: var(--text-subtle);
      max-width: 640px;
      margin: 0 auto 2.25rem auto;
      line-height: 1.6;
    }

    .demo-pane {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .demo-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 768px) {
      .demo-grid { grid-template-columns: 1fr; }
    }
    .code-panel {
      padding: 1.5rem;
      border-right: 1px solid var(--border-subtle);
      font-family: 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #cbd5e1;
      overflow-x: auto;
      background: #0b0f19;
    }
    .preview-panel {
      padding: 1.5rem;
      background: #0e131f;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .verification-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: #34d399;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.78rem;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 5rem;
    }
    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 1.75rem;
      border-radius: 12px;
    }
    .feature-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-brand);
      margin-bottom: 0.6rem;
    }
    .feature-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
    }
    .feature-card p {
      color: var(--text-subtle);
      font-size: 0.88rem;
      line-height: 1.6;
      margin: 0;
    }

    footer {
      border-top: 1px solid var(--border-subtle);
      padding: 3rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <div class="brand-logo">
        <div class="brand-icon">§</div>
        <span>Sig</span>
      </div>
      <div class="nav-links">
        <a href="https://github.com/TomCallan/Sig" target="_blank" style="color:var(--text-subtle);font-size:0.9rem">GitHub</a>
        <a href="/admin.html" class="btn">Admin Portal</a>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <!-- Content dynamically updated via JS -->
  </main>

  <footer>
    <div class="container">
      <p style="margin:0 0 0.5rem 0">Sig (LegalForm) — Open Source Legal Document Infrastructure</p>
      <p style="margin:0">Self-Hostable • Cloudflare Workers & Pages • MIT License</p>
    </div>
  </footer>

<script>
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://127.0.0.1:8787'
  : 'https://legalform-api.tomcallan0.workers.dev';

const params = new URLSearchParams(window.location.search);
const pathSegments = window.location.pathname.split('/').filter(Boolean);
const lastSegment = pathSegments.length > 0 ? pathSegments[pathSegments.length - 1] : null;
const slugParam = params.get('slug');
const slug = slugParam || (lastSegment && !lastSegment.includes('.html') && lastSegment !== 'index' ? lastSegment : null);

if (!slug) {
  // Render Home Landing Page
  document.getElementById('app').innerHTML = `
    <section class="hero">
      <div class="pill-badge">
        <span class="pulse-dot"></span>
        Self-Hostable • eIDAS & ESIGN Compliant
      </div>
      <h1>
        Legal agreements as code. <br>
        <span class="gradient-text">Signed PDFs & audit trails out.</span>
      </h1>
      <p>
        Declaratively create, deploy, pre-sign, and broadcast court-enforceable legal agreements in under 30 seconds via YAML, CLI, or MCP.
      </p>
      <div style="display:flex;gap:1rem;justify-content:center;">
        <a href="/admin.html" class="btn" style="padding:0.85rem 1.75rem;font-size:0.95rem">Open Admin Portal</a>
        <a href="https://github.com/TomCallan/Sig" target="_blank" class="btn btn-secondary" style="padding:0.85rem 1.5rem;font-size:0.95rem">GitHub Repository</a>
      </div>
    </section>

    <!-- Interactive Code vs Document Preview -->
    <div class="demo-pane">
      <div class="demo-header">
        <span>templates/nda-mutual.yaml</span>
        <span>Source of Truth → Executable Link</span>
      </div>
      <div class="demo-grid">
        <div class="code-panel">
<span style="color:#60a5fa">document</span>:
  <span style="color:#f472b6">id</span>: <span style="color:#a7f3d0">"nda-2026-001"</span>
  <span style="color:#f472b6">title</span>: <span style="color:#a7f3d0">"MUTUAL NON-DISCLOSURE AGREEMENT"</span>
  <span style="color:#f472b6">signing_order</span>: <span style="color:#a7f3d0">"sequential"</span>

<span style="color:#60a5fa">parties</span>:
  - <span style="color:#f472b6">id</span>: <span style="color:#a7f3d0">"discloser"</span>
    <span style="color:#f472b6">role</span>: <span style="color:#a7f3d0">"Disclosing Party Signer"</span>
    <span style="color:#f472b6">sequence</span>: 1
  - <span style="color:#f472b6">id</span>: <span style="color:#a7f3d0">"recipient"</span>
    <span style="color:#f472b6">role</span>: <span style="color:#a7f3d0">"Receiving Party Signer"</span>
    <span style="color:#f472b6">sequence</span>: 2
        </div>
        <div class="preview-panel">
          <div>
            <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.4rem">Live Executable Preview</div>
            <h4 style="margin:0 0 0.5rem 0;font-size:1.1rem">MUTUAL NON-DISCLOSURE AGREEMENT</h4>
            <div style="font-size:0.8rem;color:var(--text-subtle);margin-bottom:1.5rem">Jurisdiction: State of Delaware, USA & EU eIDAS</div>
            
            <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);padding:0.85rem;border-radius:8px;margin-bottom:0.75rem;">
              <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                <span style="font-weight:600">Signer 1: Discloser</span>
                <span style="color:#34d399">UNLOCKED</span>
              </div>
            </div>
            <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);padding:0.85rem;border-radius:8px;">
              <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                <span style="font-weight:600">Signer 2: Recipient</span>
                <span style="color:var(--text-muted)">LOCKED (Waiting for Signer 1)</span>
              </div>
            </div>
          </div>

          <div style="margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center">
            <div class="verification-badge">
              <span>sha256: 8f3a...b19e VERIFIED</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Feature Grid -->
    <div class="feature-grid">
      <div class="feature-card">
        <div class="feature-tag">Legal Standing</div>
        <h3>EU & US Compliance</h3>
        <p>Native compliance with US ESIGN Act (15 U.S.C. § 7001), UETA, and EU eIDAS Regulation (EU No 910/2014, Art. 25).</p>
      </div>

      <div class="feature-card">
        <div class="feature-tag">Routing</div>
        <h3>Multi-Party & Sequential Flows</h3>
        <p>Route documents to multiple signers in sequence. Party links unlock automatically as prior signers complete execution.</p>
      </div>

      <div class="feature-card">
        <div class="feature-tag">Telemetry</div>
        <h3>Court-Grade Audit Chain</h3>
        <p>Records field focus events, value hashes, UTC NTP timestamps, and SHA-256 digests archived to Cloudflare R2 Vault.</p>
      </div>

      <div class="feature-card">
        <div class="feature-tag">PDF Generation</div>
        <h3>Instant Certificates</h3>
        <p>Generate official PDF certificates complete with embedded signature graphics, full contract text, and legal footers.</p>
      </div>

      <div class="feature-card">
        <div class="feature-tag">Protocol</div>
        <h3>Model Context Protocol (MCP)</h3>
        <p>Control your legal workflow directly from Claude Code, Antigravity CLI, or OpenCode using native MCP server tools.</p>
      </div>

      <div class="feature-card">
        <div class="feature-tag">Self-Hostable</div>
        <h3>Zero Vendor Lock-In</h3>
        <p>Runs on your own Cloudflare infrastructure (Workers, D1, R2, Pages) or locally via Python CLI.</p>
      </div>
    </div>
  `;
} else {
  // Signer execution flow (remains untouched)
  let auditTrail = [];
  let spec = null;

  function audit(type, data = {}) {
    auditTrail.push({ type, data, client_timestamp: Date.now(), url: window.location.href });
  }

  fetch(`${API_BASE}/api/doc/${slug}`)
    .then(r => {
      if (!r.ok) throw new Error('Document not found or expired');
      return r.json();
    })
    .then(doc => {
      spec = typeof doc.spec === 'string' ? JSON.parse(doc.spec) : doc.spec;
      document.getElementById('doc-title').textContent = spec.document?.title || 'Legal Document';
      if (spec.document?.jurisdiction) {
        document.getElementById('doc-jurisdiction').textContent = `Jurisdiction: ${spec.document.jurisdiction}`;
      }
      renderForm(spec.sections, doc.require_verification);
    })
    .catch(err => {
      document.getElementById('app').innerHTML = `
        <div class="paper" style="text-align:center">
          <h2 style="color:var(--danger)">Document Error</h2>
          <p>${err.message}</p>
        </div>
      `;
    });
}
</script>
</body>
</html>
