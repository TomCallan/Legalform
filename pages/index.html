<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sign Legal Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 1rem 0.75rem;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    @media (min-width: 640px) {
      body { padding: 2rem 1rem; }
    }
    .container {
      width: 100%;
      max-width: 760px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    @media (min-width: 640px) {
      .card { padding: 2rem; margin-bottom: 1.5rem; }
    }
    .doc-header {
      text-align: center;
    }
    .doc-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @media (min-width: 640px) {
      .doc-header h1 { font-size: 1.875rem; }
    }
    .doc-header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .prose {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 0.95rem;
      overflow-wrap: break-word;
    }
    .prose h1, .prose h2, .prose h3 {
      color: var(--text-main);
      margin-top: 1rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-main);
    }
    .required::after { content: " *"; color: var(--danger); }
    input[type="text"], input[type="email"], input[type="date"], textarea, select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 16px; /* Prevents iOS auto-zoom on input focus */
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }
    .signature-container {
      position: relative;
      width: 100%;
    }
    .signature-pad {
      border: 2px dashed var(--card-border);
      border-radius: 8px;
      background: #0f172a;
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      height: 180px;
      display: block;
    }
    .signature-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
    }
    .signature-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .btn-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.25rem 0.5rem;
    }
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .checkbox-group input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      margin-top: 0.1rem;
      accent-color: var(--primary);
      flex-shrink: 0;
    }
    .btn-submit {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: white;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s, transform 0.1s;
      min-height: 48px; /* Mobile touch friendly target */
    }
    .btn-submit:hover { opacity: 0.95; }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .verify-banner {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    @media (min-width: 640px) {
      .verify-banner { flex-direction: row; justify-content: space-between; align-items: center; }
    }
    .audit-notice {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      text-align: center;
      line-height: 1.4;
    }
    .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem; display: none; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="card doc-header">
      <h1 id="doc-title">Loading Document...</h1>
      <p id="doc-expiry"></p>
    </div>
    <form id="legal-form"></form>
  </div>

<script>
// API Config: auto-detect local vs production worker
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://127.0.0.1:8787'
  : 'https://legalform-api.tomcallan0.workers.dev';

const params = new URLSearchParams(window.location.search);
const slug = params.get('slug') || window.location.pathname.split('/').pop();
const verificationToken = params.get('token');

let auditTrail = [];
let signatureData = null;
let spec = null;

function audit(type, data = {}) {
  auditTrail.push({
    type,
    data,
    client_timestamp: Date.now(),
    url: window.location.href
  });
}

// Fetch Document Spec
fetch(`${API_BASE}/api/doc/${slug}`)
  .then(r => {
    if (!r.ok) throw new Error('Document not found or expired');
    return r.json();
  })
  .then(doc => {
    spec = typeof doc.spec === 'string' ? JSON.parse(doc.spec) : doc.spec;
    document.getElementById('doc-title').textContent = spec.document?.title || 'Legal Document';
    if (doc.expires_at) {
      const d = new Date(doc.expires_at * 1000);
      document.getElementById('doc-expiry').textContent = `Expires on ${d.toLocaleDateString()}`;
    }
    renderForm(spec.sections, doc.require_verification);
    audit('page_open', { slug });
  })
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center">
        <h2 style="color:var(--danger)">Document Error</h2>
        <p>${err.message}</p>
      </div>
    `;
  });

function renderSingleField(field) {
  const group = document.createElement('div');
  group.className = 'form-group';

  const label = document.createElement('label');
  label.className = field.required ? 'required' : '';
  label.textContent = field.label || field.signer_label || 'Field';
  group.appendChild(label);

  const fieldType = field.field_type || field.type;

  if (fieldType === 'signature') {
    const sigContainer = document.createElement('div');
    sigContainer.className = 'signature-container';
    
    const canvas = document.createElement('canvas');
    canvas.className = 'signature-pad';
    sigContainer.appendChild(canvas);

    const actions = document.createElement('div');
    actions.className = 'signature-actions';
    actions.innerHTML = '<span class="signature-hint">✍️ Draw inside box</span>';
    
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'btn-clear';
    clearBtn.textContent = 'Clear Signature';
    actions.appendChild(clearBtn);
    sigContainer.appendChild(actions);

    group.appendChild(sigContainer);
    setupSignaturePad(canvas, clearBtn);
  } else if (fieldType === 'select') {
    const select = document.createElement('select');
    select.name = field.name;
    select.required = !!field.required;
    (field.options || []).forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      select.appendChild(o);
    });
    const urlPrefill = params.get(`field_${field.name}`) || params.get(field.name);
    if (urlPrefill !== null) select.value = urlPrefill;
    else if (field.value !== undefined) select.value = field.value;

    select.addEventListener('focus', () => audit('field_focus', { field: field.name }));
    select.addEventListener('blur', () => audit('field_blur', { field: field.name }));
    select.addEventListener('change', (e) => {
      audit('value_change', { field: field.name, hash: btoa(e.target.value).slice(0, 12) });
    });
    group.appendChild(select);
  } else {
    const input = document.createElement(fieldType === 'textarea' ? 'textarea' : 'input');
    input.name = field.name;
    input.required = !!field.required;
    if (field.validation) input.pattern = field.validation;
    if (fieldType) input.type = fieldType;
    if (field.placeholder) input.placeholder = field.placeholder;

    const urlPrefill = params.get(`field_${field.name}`) || params.get(field.name);
    if (urlPrefill !== null) {
      input.value = urlPrefill;
    } else if (field.value !== undefined) {
      input.value = field.value;
    } else if (field.default === 'today' && fieldType === 'date') {
      input.valueAsDate = new Date();
    }

    input.addEventListener('focus', () => audit('field_focus', { field: field.name }));
    input.addEventListener('blur', () => audit('field_blur', { field: field.name }));
    input.addEventListener('change', (e) => {
      audit('value_change', { field: field.name, hash: btoa(e.target.value).slice(0, 12) });
    });

    group.appendChild(input);
  }

  const error = document.createElement('div');
  error.className = 'error-msg';
  error.id = `error-${field.name}`;
  group.appendChild(error);

  return group;
}

function renderForm(sections, requireVerification) {
  const form = document.getElementById('legal-form');

  if (requireVerification && !verificationToken) {
    const banner = document.createElement('div');
    banner.className = 'card verify-banner';
    banner.innerHTML = `
      <div>
        <strong>Email Verification Required</strong>
        <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">Enter your email to receive a magic signing link.</p>
      </div>
    `;
    form.appendChild(banner);
  }

  sections.forEach((section) => {
    const div = document.createElement('div');
    div.className = 'card';

    if (section.type === 'static') {
      div.innerHTML = `<div class="prose">${formatMarkdown(section.content)}</div>`;
    } 
    else if (section.type === 'form') {
      (section.fields || []).forEach(f => {
        const group = renderSingleField(f);
        div.appendChild(group);
      });
    }
    else if (section.type === 'signature') {
      if (section.signer_label) {
        const h3 = document.createElement('h3');
        h3.style.margin = '0 0 1rem 0';
        h3.textContent = section.signer_label;
        div.appendChild(h3);
      }
      (section.fields || []).forEach(f => {
        const group = renderSingleField(f);
        div.appendChild(group);
      });
      const sigGroup = renderSingleField({ type: 'signature', label: 'Digital Signature Canvas', name: 'signature' });
      div.appendChild(sigGroup);
    }
    else if (section.type === 'field') {
      const group = renderSingleField(section);
      div.appendChild(group);
    }
    else if (section.type === 'checkbox') {
      const urlPrefill = params.get(`field_${section.name}`) || params.get(section.name);
      const isChecked = urlPrefill !== null ? (urlPrefill === 'true' || urlPrefill === '1') : !!section.value;

      div.innerHTML = `
        <div class="checkbox-group">
          <input type="checkbox" id="${section.name}" name="${section.name}" ${section.required ? 'required' : ''} ${isChecked ? 'checked' : ''}>
          <label for="${section.name}" class="${section.required ? 'required' : ''}">${section.label}</label>
        </div>
        <div class="error-msg" id="error-${section.name}"></div>
      `;
    }

    form.appendChild(div);
  });

  const submitCard = document.createElement('div');
  submitCard.className = 'card';
  submitCard.innerHTML = `
    <button type="submit" class="btn-submit">Sign & Complete Agreement</button>
    <div class="audit-notice">
      🛡️ Encrypted & Legally Audited: IP, precise timestamp, and interaction history are logged to Cloudflare D1.
    </div>
  `;
  form.appendChild(submitCard);

  form.addEventListener('submit', handleSubmit);
}

function formatMarkdown(text) {
  return text
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function setupSignaturePad(canvas, clearBtn) {
  let ctx;
  const initCanvas = () => {
    canvas.width = canvas.offsetWidth;
    canvas.height = 180;
    ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#818cf8';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  };

  setTimeout(initCanvas, 100);
  window.addEventListener('resize', () => {
    if (signatureData === null) initCanvas();
  });

  let drawing = false;
  let points = [];

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  };

  const start = (e) => {
    drawing = true;
    points = [getPos(e)];
  };

  const move = (e) => {
    if (!drawing || !ctx) return;
    if (e.cancelable) e.preventDefault(); // Prevent page touch scrolling while drawing signature
    const pos = getPos(e);
    points.push(pos);
    ctx.beginPath();
    ctx.moveTo(points[points.length - 2].x, points[points.length - 2].y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  };

  const end = () => {
    if (!drawing) return;
    drawing = false;
    signatureData = canvas.toDataURL();
    audit('signature_drawn', { stroke_points: points.length });
  };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: true });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  clearBtn.addEventListener('click', () => {
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    signatureData = null;
  });
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = 'Encrypting & Submitting...';

  const fields = {};
  let emailValue = '';

  const processFields = (items) => {
    items.forEach(s => {
      if (s.fields) {
        processFields(s.fields);
      } else if (s.name && s.type !== 'signature') {
        const el = document.querySelector(`[name="${s.name}"]`);
        if (el) {
          fields[s.name] = el.type === 'checkbox' ? el.checked : el.value;
          if (s.field_type === 'email' || s.type === 'email' || s.name.includes('email')) {
            emailValue = el.value;
          }
        }
      }
    });
  };

  processFields(spec.sections);

  if (!signatureData) {
    alert('Please draw your signature before submitting.');
    btn.disabled = false;
    btn.textContent = 'Sign & Complete Agreement';
    return;
  }

  const fingerprint = btoa([
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    new Date().getTimezoneOffset()
  ].join('|'));

  audit('submit_start', { field_count: Object.keys(fields).length });

  try {
    const res = await fetch(`${API_BASE}/api/submit/${slug}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: emailValue,
        fields,
        signature_svg: signatureData,
        fingerprint,
        auditTrail,
        verification_token: verificationToken
      })
    });

    const result = await res.json();

    if (res.ok) {
      document.getElementById('app').innerHTML = `
        <div class="card" style="text-align:center; padding:2.5rem 1rem">
          <div style="font-size:3rem;margin-bottom:1rem">✍️</div>
          <h2>Document Successfully Signed</h2>
          <p style="color:var(--text-muted)">Your non-repudiable electronic signature has been cryptographically recorded.</p>
          <div style="background:rgba(15,23,42,0.8);padding:1rem;border-radius:8px;text-align:left;font-family:monospace;font-size:0.8rem;margin:1.5rem 0;word-break:break-all;">
            <div><strong>Submission ID:</strong> ${result.submission_id}</div>
            <div style="margin-top:0.5rem"><strong>Audit Hash:</strong> ${result.audit_hash}</div>
          </div>
        </div>
      `;
    } else {
      alert(result.error || 'Submission failed.');
      btn.disabled = false;
      btn.textContent = 'Sign & Complete Agreement';
    }
  } catch (err) {
    alert('Network error submitting document: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Sign & Complete Agreement';
  }
}
</script>
</body>
</html>
