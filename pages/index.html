<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Legalform - Cryptographic Legal Agreements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-base: #ffffff;
      --bg-surface: #fafafa;
      --bg-surface-hover: #f5f5f5;
      --border-subtle: #e5e5e5;
      --border-active: #000000;

      --text-muted: #6e6e73;
      --accent-brand: #000000;

      --error: #c02424;
    }
    * { box-sizing: border-box; font-family: 'Zen Kaku Gothic New', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent-brand); text-decoration: none; transition: color 0.2s; }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 clamp(12px, 3vw, 32px);
      width: 100%;
    }
    
    header {
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-base);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 64px;
      padding: 0.5rem 0;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    /* Mobile Responsive Rules */
    @media (max-width: 640px) {
      .container { padding: 0 12px; }
      .header-inner { padding: 0.75rem 0; flex-direction: column; align-items: flex-start; gap: 0.4rem; }
      .signer-wrapper { padding: 1rem 0 2rem; }
      .signer-head { padding: 1.25rem 1rem; }
      .signer-body { padding: 1.25rem 1rem; }
      .signer-title { font-size: 1.5rem; margin-bottom: 0.75rem; }
      .signer-section { margin-bottom: 1.75rem; }
      .btn { width: 100%; padding: 0.75rem 1rem; font-size: 0.8rem; }
      .sig-pad { height: 160px; }
      .sig-actions { flex-direction: column; gap: 0.5rem; align-items: flex-start; }

    .btn {
      background: var(--text-main);
      color: var(--bg-base);

    .btn-outline:hover { background: var(--bg-surface); border-color: var(--text-main); color: var(--text-main); }

    .signer-title {

      flex-direction: column;

    .toast-head {

    .b-add-field { align-self:flex-start; background:transparent; border:1px dashed var(--border-subtle); color:var(--text-muted); padding:0.35rem 0.8rem; font:inherit; font-size:0.7rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; border-radius:0; margin-top:0.4rem; }

<script src="builder.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const DEFAULT_API_BASE = window.location.hostname.includes('pages.dev') ? 'https://legalform-api.tomcallan0.workers.dev' : '';
const API_BASE = window.LEGALFORM_API_BASE || params.get('api_base') || localStorage.getItem('LEGALFORM_API_BASE') || DEFAULT_API_BASE;
const slug = params.get('slug') || 'my-nda';

const queryPrefills = {};
for (const [key, val] of params.entries()) {
  if (key !== 'slug' && key !== 'api_base') queryPrefills[key] = val;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function safeFetchJson(url, options) {
  let res;
  try {
    res = await fetch(url, options);
  } catch (netErr) {
    const err = new Error(`Network error connecting to backend (${url}): ${netErr.message}`);
    err.isNetwork = true;
    throw err;
  }

  const contentType = res.headers.get('content-type') || '';
  const text = await res.text();

  if (text.trim().startsWith('<') || contentType.includes('text/html')) {
    if (res.status === 403) {
      const err = new Error('Access Denied (HTTP 403): Cloudflare firewall or WAF blocked access to this API route.');
      err.status = 403;
      throw err;
    }
    if (res.status === 404) {
      const err = new Error('API Endpoint Not Found (HTTP 404): Cloudflare Pages served static HTML instead of Worker API. Ensure Worker routing is configured or pass ?api_base=URL.');
      err.status = 404;
      throw err;
    }
    const err = new Error(`API returned HTML instead of expected JSON (HTTP ${res.status}). Verify Cloudflare Worker deployment or API_BASE configuration.`);
    err.status = res.status;
    throw err;
  }

  let data;
  try {
    data = JSON.parse(text);
  } catch (parseErr) {
    const err = new Error(`Invalid JSON response (HTTP ${res.status}): ${text.slice(0, 120)}`);
    err.status = res.status;
    throw err;
  }

  if (!res.ok) {
    const msg = data.error || data.message || `Server returned error status ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }

  return data;
}

function showToast(message, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }

  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');

  const label = document.createElement('div');
  label.className = 'toast-label';
  label.textContent = type === 'error' ? 'Error' : type === 'success' ? 'Success' : 'Notice';

  const close = document.createElement('button');
  close.className = 'toast-close';
  close.setAttribute('aria-label', 'Dismiss notification');
  close.textContent = '\u00d7';
  close.addEventListener('click', () => dismissToast(el));

  const head = document.createElement('div');
  head.className = 'toast-head';
  head.appendChild(label);
  head.appendChild(close);

  const msg = document.createElement('div');
  msg.className = 'toast-msg';
  msg.textContent = message;

  el.appendChild(head);
  el.appendChild(msg);
  container.appendChild(el);

  setTimeout(() => dismissToast(el), type === 'error' ? 7000 : 4000);
}

function dismissToast(el) {
  if (!el || el.dataset.dismissed) return;
  el.dataset.dismissed = '1';
  el.classList.add('toast-leave');
  setTimeout(() => el.remove(), 240);
}

async function loadDocument() {
  const container = document.getElementById('main-content');
  if (window.location.pathname.startsWith('/dashboard') || !params.has('slug')) {
    renderDashboard();
    return;
  }

  try {
    const doc = await safeFetchJson(`${API_BASE}/api/doc/${slug}`);
    const spec = typeof doc.spec === 'string' ? JSON.parse(doc.spec) : doc.spec;
    renderSigner(doc, spec);
  } catch (err) {
    const is403 = err.status === 403 || (err.message && err.message.toLowerCase().includes('access denied'));
    const titleText = is403 ? 'Access Denied' : 'Unable to Load Document';
    container.innerHTML = `
      <div style="padding: 3rem;">
        <div style="color: var(--error); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: clamp(12px, 1vw, 15px); margin-bottom: 0.75rem;">${esc(titleText)}</div>
        <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); margin: 0; line-height: 1.5;">${esc(err.message)}</p>
        <div style="margin-top: 1.5rem;">
          <a href="/dashboard" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">View Sender Ledger Dashboard</a>
        </div>
      </div>`;
  }
}

const DASHBOARD_AUTH_HASH = 'ed27cc4da76834c9eb5bd7c29e4b6001d93a7dc800323beaaa49ebda91361e08';
const DASHBOARD_AUTH_KEY = 'legalform_dashboard_unlocked';

async function sha256Hex(input) {
  const bytes = new TextEncoder().encode(input);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function deploySpecObject(spec) {
  if (!spec || typeof spec !== 'object' || !spec.document || !spec.document.id) {
    throw new Error('Spec must include a top-level document key with an id.');
  }
  const docId = String(spec.document.id);
  const slug = (await sha256Hex(`${docId}-${new Date().toISOString()}`)).slice(0, 12);
  const expiresDays = Number(spec.document.expires_in_days || 30);
  const expiresAt = Math.floor(Date.now() / 1000) + expiresDays * 86400;

  const res = await fetch(`${API_BASE}/api/documents`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: docId, slug, spec, expires_at: expiresAt })
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `Deploy failed (HTTP ${res.status})`);
  }
  const data = await res.json();
  const signLink = `${window.location.origin}/?slug=${data.slug}`;

  await renderDashboard(); // refresh the ledger below (re-renders both deploy panes)
  const result = document.getElementById('deploy-result');
  if (result) {
    result.innerHTML = `
      <div style="border:1px solid var(--border-subtle); border-radius:0; padding:0.85rem; background:var(--bg-base); font-size:0.8rem;">
        <div style="color: var(--success); font-weight:600; margin-bottom:0.5rem;">✓ Deployed — Document ID: ${esc(data.id)}</div>
        <div style="color:var(--text-muted); margin-bottom:0.25rem;">Shareable signing link:</div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
          <code style="word-break:break-all; color:var(--text-main);">${esc(signLink)}</code>
          <button class="btn btn-outline" style="padding:0.25rem 0.6rem; font-size:0.7rem;" onclick="navigator.clipboard.writeText('${esc(signLink)}')">Copy</button>
        </div>
      </div>`;
  }
  showToast(`Document "${data.id}" deployed.`, 'success');
  return data;
}

async function deployDocumentFromPanel() {
  const textarea = document.getElementById('deploy-spec');
  const btn = document.getElementById('deploy-btn');
  const status = document.getElementById('deploy-status');

  let spec;
  try {
    spec = (typeof window.jsyaml !== 'undefined')
      ? window.jsyaml.load(textarea.value)
      : JSON.parse(textarea.value); // YAML is a superset of JSON — degrade gracefully
  } catch (err) {
    showToast(`YAML parse error: ${err.message}`, 'error');
    return;
  }

  btn.disabled = true;
  status.textContent = 'Deploying…';
  try {
    await deploySpecObject(spec);
    textarea.value = '';
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    status.textContent = '';
  }
}

async function downloadSubPdf(payloadStr, subShortId) {
  try {
    const res = await fetch(`${API_BASE}/api/render-pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payloadStr
    });
    if (!res.ok) throw new Error('PDF compilation failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `executed-agreement-${subShortId}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(err) {
    showToast(`PDF download error: ${err.message}`, 'error');
  }
}

function confirmMonarch({ title, message, confirmLabel, danger, onConfirm }) {
  const overlay = document.createElement('div');
  overlay.className = 'b-preview-overlay';
  overlay.innerHTML = `
    <div class="b-preview-modal" style="max-width:420px;">
      <div class="b-preview-toolbar">
        <span class="b-lbl" style="margin:0;">${esc(title)}</span>
        <button type="button" class="b-close" data-c="cancel" aria-label="Cancel">&#215;</button>
      </div>
      <div style="padding:1rem 1rem 1.5rem; font-size:0.85rem; line-height:1.6; color:var(--text-main);">${esc(message)}</div>
      <div class="b-preview-toolbar b-preview-foot" style="justify-content:flex-end;">
        <button type="button" data-c="confirm" class="btn${danger ? ' btn-danger-ghost' : ''}" style="padding:0.5rem 1rem; font-size:0.75rem;">${esc(confirmLabel || 'Confirm')}</button>
        <button type="button" data-c="cancel" class="btn btn-outline" style="padding:0.5rem 1rem; font-size:0.75rem;">Cancel</button>
      </div>
    </div>`;
  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-c="cancel"]').forEach(b => b.addEventListener('click', close));
  overlay.querySelector('[data-c="confirm"]').addEventListener('click', () => { close(); if (onConfirm) onConfirm(); });
  document.body.appendChild(overlay);
}

function renderStaticBody(content) {
  const lines = String(content ?? '').replace(/\r\n/g, '\n').split('\n');
  const parts = [];
  let para = [];
  const flush = () => {
    if (para.length) { parts.push(`<p>${para.join('<br>')}</p>`); para = []; }
  };
  for (const raw of lines) {
    if (raw.startsWith('## ')) {
      flush();
      parts.push(`<h2 class="static-heading">${esc(raw.slice(3))}</h2>`);
    } else if (raw.trim() === '') {
      flush();
    } else {
      para.push(esc(raw));
    }
  }
  flush();
  return parts.join('');
}

function renderSigner(doc, spec) {
  const container = document.getElementById('main-content');
  const d = spec.document || {};
  const formValues = {};
  
  let html = `
    <div class="signer-head">
      <div class="signer-eyebrow">${esc(d.jurisdiction || 'Electronic Execution')}</div>
      <h1 class="signer-title">${esc(d.title || 'Legal Document')}</h1>
      <div class="signer-meta">
        <span>Document ID ${esc(doc.id)}</span>
        <span>Date ${new Date().toISOString().slice(0, 10)}</span>
      </div>
    </div>
    <div class="signer-body">
  `;

  let sigPadInit = null;

  (spec.sections || []).forEach((sec) => {
    if (sec.type === 'static') {
      html += `
        <div class="signer-section">
          <div class="static-body">${renderStaticBody(sec.content)}</div>
        </div>`;
    } else if (sec.type === 'form' || sec.type === 'signature') {
      html += `<div class="signer-section">`;
      if (sec.signer_label) {
        html += `<div class="section-label">${esc(sec.signer_label)}</div>`;
      }
      
      (sec.fields || []).forEach(f => {
        let defaultVal = queryPrefills[f.name] || f.value || '';
        if (f.type === 'datetime-auto') {
          defaultVal = new Date().toISOString().slice(0, 19).replace('T', ' ');
        }
        formValues[f.name] = defaultVal;

        if (f.type === 'checkbox') {
          const isChecked = defaultVal === true || defaultVal === 'true' || defaultVal === 'on';
          formValues[f.name] = isChecked ? 'Yes' : 'No';
          html += `
            <div class="form-group" style="display:flex; align-items:center; gap:0.75rem;">
              <input type="checkbox" 
                     id="field-${esc(f.name)}" 
                     data-field="${esc(f.name)}" 
                     ${isChecked ? 'checked' : ''} 
                     style="width:20px; height:20px; cursor:pointer;" 
                     ${f.required ? 'required' : ''}>
              <label for="field-${esc(f.name)}" style="margin-bottom:0; cursor:pointer;">${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
            </div>`;
        } else if (f.type === 'radio' && Array.isArray(f.options)) {
          html += `<div class="form-group"><label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label><div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:0.5rem;">`;
          f.options.forEach((opt, oIdx) => {
            const isSel = String(defaultVal) === String(opt);
            html += `
              <label style="display:flex; align-items:center; gap:0.5rem; font-weight:normal; text-transform:none; letter-spacing:normal; cursor:pointer;">
                <input type="radio" 
                       name="field-${esc(f.name)}" 
                       data-field="${esc(f.name)}" 
                       value="${esc(opt)}" 
                       ${isSel ? 'checked' : ''} 
                       ${f.required ? 'required' : ''}>
                ${esc(opt)}
              </label>`;
          });
          html += `</div></div>`;
        } else if (f.type === 'select' && Array.isArray(f.options)) {
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <select class="form-control" data-field="${esc(f.name)}" ${f.required ? 'required' : ''}>
                ${f.options.map(o => `<option value="${esc(o)}" ${String(defaultVal) === String(o) ? 'selected' : ''}>${esc(o)}</option>`).join('')}
              </select>
            </div>`;
        } else if (f.type === 'textarea') {
          const textRows = f.rows || 6;
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <textarea class="form-control" data-field="${esc(f.name)}" rows="${textRows}" style="min-height:${textRows * 1.7}em; resize:vertical;" ${f.required ? 'required' : ''}>${esc(defaultVal)}</textarea>
            </div>`;
        } else {
          const isReadOnly = f.type === 'datetime-auto' ? 'readonly' : '';
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <input type="${f.type === 'email' ? 'email' : 'text'}" 
                     class="form-control" 
                     data-field="${esc(f.name)}" 
                     value="${esc(defaultVal)}" 
                     ${isReadOnly} 
                     ${f.required ? 'required' : ''}>
            </div>`;
        }
      });

      if (sec.type === 'signature') {
        if (d.legal_footer) {
          html += `<p class="legal-footer">${esc(d.legal_footer)}</p>`;
        }
        html += `
          <div class="form-group">
            <label>Draw Signature Above *</label>
            <canvas id="signature-canvas" class="sig-pad"></canvas>
            <div class="sig-actions">
              <span class="sig-hint">Sign inside box using mouse or touch</span>
              <button type="button" class="btn-danger-ghost" id="clear-sig">Clear</button>
            </div>
          </div>`;
      }
      html += `</div>`;
    }
  });

  html += `
      <div style="margin-top: 2rem;">
        <button id="submit-btn" class="btn" style="width:100%; padding:0.9rem 2rem;">
          Sign & Execute
        </button>
      </div>
    </div>
  `;

  container.innerHTML = html;

  container.querySelectorAll('input[data-field], select[data-field], textarea[data-field]').forEach(input => {
    const fn = e => {
      const fieldName = e.target.dataset.field;
      if (e.target.type === 'checkbox') {
        formValues[fieldName] = e.target.checked ? 'Yes' : 'No';
      } else {
        formValues[fieldName] = e.target.value;
      }
    };
    input.addEventListener('input', fn);
    input.addEventListener('change', fn);
  });

  const canvas = document.getElementById('signature-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let strokes = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#000000';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    resizeCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    const startDraw = e => { isDrawing = true; strokes++; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const draw = e => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const stopDraw = () => { isDrawing = false; };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    document.getElementById('clear-sig').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes = 0;
    });

    sigPadInit = {
      hasSignature: () => strokes > 0,
      toSVG: () => canvas.toDataURL()
    };
  }

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const btn = document.getElementById('submit-btn');
    if (sigPadInit && !sigPadInit.hasSignature()) {
      btn.textContent = 'Signature required';
      setTimeout(() => { btn.textContent = 'Sign & Execute'; }, 2000);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Recording Execution…';

    try {
      const payload = {
        fields: formValues,
        signature_data: sigPadInit ? sigPadInit.toSVG() : ''
      };

      const result = await safeFetchJson(`${API_BASE}/api/submit/${slug}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      renderSuccess(doc, result);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Sign & Execute';
    }
  });
}

function renderSuccess(doc, result) {
  const container = document.getElementById('main-content');
  const payloadJson = JSON.stringify(result.payload, null, 2);

  container.innerHTML = `
    <div class="signer-head">
      <div class="signer-eyebrow" style="color: var(--success);">Execution Recorded</div>
      <h1 class="signer-title">Document Signed</h1>
      <p style="margin: 0; color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); line-height: 1.6;">${esc(doc.id)} — execution complete. Agreement cryptographically recorded.</p>
    </div>
    <div class="signer-body">
      <div class="signer-meta" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;">
        <span>Submission ID ${esc(result.submission_id)}</span>
      </div>
      <div class="audit-row">
        <div class="section-label">Cryptographic Audit — SHA-256 Digest</div>
        <div class="audit-hash">${esc(result.audit_hash)}</div>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:1rem; margin-top:2rem;">
        <button id="download-pdf-btn" class="btn">
          📄 Download Compiled PDF Agreement
        </button>
        <button id="download-json-btn" class="btn btn-outline">
          📥 Export Local Compact JSON Data
        </button>
      </div>
    </div>
  `;

  document.getElementById('download-pdf-btn').addEventListener('click', async () => {
    const btn = document.getElementById('download-pdf-btn');
    btn.disabled = true;
    btn.textContent = 'Generating PDF...';
    try {
      const res = await fetch(`${API_BASE}/api/render-pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payloadJson
      });
      if (!res.ok) throw new Error('PDF compilation failed');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `executed-agreement-${result.submission_id.slice(0, 8)}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '📄 Download Compiled PDF Agreement';
    }
  });

  document.getElementById('download-json-btn').addEventListener('click', () => {
    const blob = new Blob([payloadJson], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `signed-document-${result.submission_id.slice(0, 8)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

loadDocument();
</script>
</body>
</html>
