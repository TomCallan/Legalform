<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Legalform - Cryptographic Legal Agreements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #ffffff;
      --bg-surface: #fafafa;
      --bg-surface-hover: #f5f5f5;
      --border-subtle: #e5e5e5;
      --border-active: #000000;
      --text-main: #000000;
      --text-muted: #6e6e73;
      --accent-brand: #000000;
      --success: #0f7b3d;
      --error: #c02424;
    }
    * { box-sizing: border-box; font-family: 'Zen Kaku Gothic New', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent-brand); text-decoration: none; transition: color 0.2s; }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 clamp(12px, 3vw, 32px);
      width: 100%;
    }
    
    header {
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-base);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 64px;
      padding: 0.5rem 0;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    /* Mobile Responsive Rules */
    @media (max-width: 640px) {
      .container { padding: 0 12px; }
      .header-inner { padding: 0.75rem 0; flex-direction: column; align-items: flex-start; gap: 0.4rem; }
      .signer-wrapper { padding: 1rem 0 2rem; }
      .signer-head { padding: 1.25rem 1rem; }
      .signer-body { padding: 1.25rem 1rem; }
      .signer-title { font-size: 1.5rem; margin-bottom: 0.75rem; }
      .signer-section { margin-bottom: 1.75rem; }
      .btn { width: 100%; padding: 0.75rem 1rem; font-size: 0.8rem; }
      .sig-pad { height: 160px; }
      .sig-actions { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
      .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
    }
    
    .btn {
      background: var(--text-main);
      color: var(--bg-base);
      padding: 0.8rem 2rem;
      border-radius: 0;
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .btn:hover { background: var(--bg-base); color: var(--text-main); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }
    .btn-outline:hover { background: var(--bg-surface); border-color: var(--text-main); color: var(--text-main); }

    /* Signer Flow */
    .signer-wrapper {
      padding: clamp(32px, 6vh, 72px) 0 4rem;
    }
    .signer-card {
      border: 1px solid var(--border-subtle);
      background: var(--bg-base);
    }
    .signer-head {
      padding: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .signer-eyebrow {
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .signer-title {
      font-size: clamp(22px, 3.2vw, 38px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text-main);
      margin: 0 0 1.25rem;
    }
    .signer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 2rem;
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .signer-body { padding: 2rem; }
    .signer-section { margin-bottom: 2.5rem; }
    .signer-section:last-child { margin-bottom: 0; }
    
    .section-label {
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .static-body p {
      margin: 0 0 1rem;
      font-size: clamp(13px, 0.95vw, 15px);
      line-height: 1.7;
      color: var(--text-main);
    }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block;
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .form-control {
      width: 100%;
      background: var(--bg-surface-hover);
      border: 1px solid transparent;
      padding: 0.8rem 1rem;
      font-family: inherit;
      font-size: clamp(13px, 0.95vw, 15px);
      color: var(--text-main);
      outline: none;
      border-radius: 0;
      transition: all 0.2s;
    }
    .form-control:focus {
      background: var(--bg-base);
      border-color: var(--border-active);
    }
    .form-control[readonly] { cursor: default; }
    
    .legal-footer {
      margin: 2rem 0;
      padding: 1.25rem 0;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      font-size: clamp(13px, 0.95vw, 15px);
      line-height: 1.6;
      color: var(--text-main);
    }
    
    .sig-pad {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      width: 100%;
      height: 200px;
      display: block;
      touch-action: none;
      cursor: crosshair;
      border-radius: 0;
    }
    .sig-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }
    .sig-hint {
      font-size: clamp(10px, 0.75vw, 11px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .btn-danger-ghost {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      padding: 0.5rem 1rem;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 0;
      transition: all 0.2s;
    }
    .btn-danger-ghost:hover { background: var(--error); color: var(--bg-base); }

    .audit-row {
      border-top: 1px solid var(--border-subtle);
      padding-top: 1.5rem;
      margin-top: 2rem;
      font-variant-numeric: tabular-nums;
    }
    .audit-hash {
      font-size: clamp(10px, 0.75vw, 12px);
      color: var(--text-main);
      letter-spacing: 0.08em;
      word-break: break-all;
      line-height: 1.6;
      margin-top: 0.5rem;
    }

    footer {
      margin-top: auto;
      border-top: 1px solid var(--border-subtle);
      padding: 1.5rem 0;
      color: var(--text-muted);
      font-size: clamp(9px, 0.7vw, 11px);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="/" class="brand">
        Legalform
      </a>
      <div style="display:flex; gap:1.5rem; align-items:center;">
        <a href="/dashboard" id="dashboard-link" style="font-size: clamp(11px, 0.8vw, 13px); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-main);">
          Dashboard / Document Ledger &rarr;
        </a>
      </div>
    </div>
  </header>

  <main id="app">
    <div class="container signer-wrapper">
      <div class="signer-card" id="main-content">
        <div style="padding: 4rem; text-align: center;">
          <div class="section-label">Loading Document</div>
          <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); margin: 0;">Fetching cryptographic signature record…</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      LEGALFORM — MONARCH DESIGN SYSTEM • COURT-ENFORCEABLE SIGNATURE INFRASTRUCTURE
    </div>
  </footer>

<script>
const API_BASE = '';
const params = new URLSearchParams(window.location.search);
const slug = params.get('slug') || 'my-nda';

const queryPrefills = {};
for (const [key, val] of params.entries()) {
  if (key !== 'slug') queryPrefills[key] = val;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadDocument() {
  const container = document.getElementById('main-content');
  if (window.location.pathname.startsWith('/dashboard')) {
    renderDashboard();
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/doc/${slug}`);
    if (!res.ok) throw new Error('Document not found or link expired.');
    const doc = await res.json();
    const spec = typeof doc.spec === 'string' ? JSON.parse(doc.spec) : doc.spec;
    renderSigner(doc, spec);
  } catch (err) {
    container.innerHTML = `
      <div style="padding: 3rem;">
        <div style="color: var(--error); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: clamp(12px, 1vw, 15px); margin-bottom: 0.75rem;">Access Denied</div>
        <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); margin: 0;">${esc(err.message)}</p>
      </div>`;
  }
}

async function renderDashboard() {
  const container = document.getElementById('main-content');
  container.innerHTML = `
    <div class="signer-head">
      <div class="signer-eyebrow">Sender Management Ledger</div>
      <h1 class="signer-title">Received Submissions & Documents</h1>
    </div>
    <div class="signer-body" id="dash-body">
      <p style="color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px);">Fetching active document ledger and received submissions...</p>
    </div>`;

  try {
    const res = await fetch(`${API_BASE}/api/documents/list`);
    const data = await res.json();
    const docs = data.documents || [];
    const dashBody = document.getElementById('dash-body');

    if (!docs.length) {
      dashBody.innerHTML = `<p style="color: var(--text-muted);">No documents deployed yet.</p>`;
      return;
    }

    let cardsHtml = '';
    for (const d of docs) {
      let subDataHtml = '<p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">No submissions received yet.</p>';
      
      try {
        const subRes = await fetch(`${API_BASE}/api/export/${d.id}`);
        const subResult = await subRes.json();
        const subs = subResult.submissions || [];
        
        if (subs.length > 0) {
          subDataHtml = subs.map(s => {
            let fieldsObj = {};
            try { fieldsObj = typeof s.data_json === 'string' ? JSON.parse(s.data_json) : (s.data_json || {}); } catch(e) {}
            const fieldPairs = Object.entries(fieldsObj).map(([k, v]) => `<span style="display:inline-block; margin-right:1rem;"><strong>${esc(k)}:</strong> ${esc(v)}</span>`).join('');
            
            const subPayload = JSON.stringify({
              submission_id: s.id,
              document_id: d.id,
              spec: subResult.spec,
              signer_email: s.signer_email,
              signer_name: s.signer_name,
              fields: fieldsObj,
              signature_data: s.signature_data,
              audit_hash: s.audit_hash,
              submitted_at: s.submitted_at
            });

            return `
              <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); padding: 1rem; margin-top: 0.75rem; font-size: 0.85rem;">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
                  <div><strong>Signer:</strong> ${esc(s.signer_name || 'N/A')} (${esc(s.signer_email || 'N/A')})</div>
                  <div style="font-variant-numeric: tabular-nums; color: var(--text-muted);">${new Date((s.submitted_at || 0) * 1000).toLocaleString()}</div>
                </div>
                <div style="margin-bottom: 0.5rem; color: var(--text-main); line-height: 1.5;">${fieldPairs || 'No custom fields'}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted); font-family: monospace; word-break: break-all; margin-bottom: 0.75rem;">SHA-256 Digest: ${esc(s.audit_hash)}</div>
                <div>
                  <button onclick='downloadSubPdf(${esc(JSON.stringify(subPayload))}, "${esc(s.id.slice(0, 8))}")' class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">
                    📄 Download Signed PDF
                  </button>
                </div>
              </div>`;
          }).join('');
        }
      } catch(e) {
        console.error('Error fetching submissions for', d.id, e);
      }

      cardsHtml += `
        <div style="border: 1px solid var(--border-subtle); padding: 1.25rem; margin-bottom: 1.5rem; background: var(--bg-base);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem; margin-bottom: 0.75rem;">
            <div>
              <strong style="font-size: 1rem;">${esc(d.id)}</strong>
              <span style="margin-left: 0.5rem; color: ${d.status === 'active' ? 'var(--success)' : 'var(--error)'}; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;">${esc(d.status)}</span>
            </div>
            <div>
              <a href="/?slug=${esc(d.slug)}" target="_blank" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.75rem; margin-right: 0.4rem;">Open Sign Link</a>
              <button onclick="exportDocData('${esc(d.id)}')" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;">Export JSON</button>
            </div>
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">
            Received Submissions (${d.submission_count}):
          </div>
          ${subDataHtml}
        </div>`;
    }

    dashBody.innerHTML = cardsHtml;
  } catch (err) {
    document.getElementById('dash-body').innerHTML = `<p style="color: var(--error);">Error loading ledger: ${esc(err.message)}</p>`;
  }
}

async function downloadSubPdf(payloadStr, subShortId) {
  try {
    const res = await fetch(`${API_BASE}/api/render-pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payloadStr
    });
    if (!res.ok) throw new Error('PDF compilation failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `executed-agreement-${subShortId}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(err) {
    alert(`PDF download error: ${err.message}`);
  }
}

async function exportDocData(docId) {
  try {
    const res = await fetch(`${API_BASE}/api/export/${docId}`);
    const data = await res.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `export-${docId}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(`Export failed: ${err.message}`);
  }
}

function renderSigner(doc, spec) {
  const container = document.getElementById('main-content');
  const d = spec.document || {};
  const formValues = {};
  
  let html = `
    <div class="signer-head">
      <div class="signer-eyebrow">${esc(d.jurisdiction || 'Electronic Execution')}</div>
      <h1 class="signer-title">${esc(d.title || 'Legal Document')}</h1>
      <div class="signer-meta">
        <span>Document ID ${esc(doc.id)}</span>
        <span>Date ${new Date().toISOString().slice(0, 10)}</span>
      </div>
    </div>
    <div class="signer-body">
  `;

  let sigPadInit = null;

  (spec.sections || []).forEach((sec) => {
    if (sec.type === 'static') {
      html += `
        <div class="signer-section">
          <div class="static-body">${esc(sec.content).replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>')}</div>
        </div>`;
    } else if (sec.type === 'form' || sec.type === 'signature') {
      html += `<div class="signer-section">`;
      if (sec.signer_label) {
        html += `<div class="section-label">${esc(sec.signer_label)}</div>`;
      }
      
      (sec.fields || []).forEach(f => {
        let defaultVal = queryPrefills[f.name] || f.value || '';
        if (f.type === 'datetime-auto') {
          defaultVal = new Date().toISOString().slice(0, 19).replace('T', ' ');
        }
        formValues[f.name] = defaultVal;

        if (f.type === 'checkbox') {
          const isChecked = defaultVal === true || defaultVal === 'true' || defaultVal === 'on';
          formValues[f.name] = isChecked ? 'Yes' : 'No';
          html += `
            <div class="form-group" style="display:flex; align-items:center; gap:0.75rem;">
              <input type="checkbox" 
                     id="field-${esc(f.name)}" 
                     data-field="${esc(f.name)}" 
                     ${isChecked ? 'checked' : ''} 
                     style="width:20px; height:20px; cursor:pointer;" 
                     ${f.required ? 'required' : ''}>
              <label for="field-${esc(f.name)}" style="margin-bottom:0; cursor:pointer;">${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
            </div>`;
        } else if (f.type === 'radio' && Array.isArray(f.options)) {
          html += `<div class="form-group"><label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label><div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:0.5rem;">`;
          f.options.forEach((opt, oIdx) => {
            const isSel = String(defaultVal) === String(opt);
            html += `
              <label style="display:flex; align-items:center; gap:0.5rem; font-weight:normal; text-transform:none; letter-spacing:normal; cursor:pointer;">
                <input type="radio" 
                       name="field-${esc(f.name)}" 
                       data-field="${esc(f.name)}" 
                       value="${esc(opt)}" 
                       ${isSel ? 'checked' : ''} 
                       ${f.required ? 'required' : ''}>
                ${esc(opt)}
              </label>`;
          });
          html += `</div></div>`;
        } else if (f.type === 'select' && Array.isArray(f.options)) {
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <select class="form-control" data-field="${esc(f.name)}" ${f.required ? 'required' : ''}>
                ${f.options.map(o => `<option value="${esc(o)}" ${String(defaultVal) === String(o) ? 'selected' : ''}>${esc(o)}</option>`).join('')}
              </select>
            </div>`;
        } else {
          const isReadOnly = f.type === 'datetime-auto' ? 'readonly' : '';
          html += `
            <div class="form-group">
              <label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>
              <input type="${f.type === 'email' ? 'email' : 'text'}" 
                     class="form-control" 
                     data-field="${esc(f.name)}" 
                     value="${esc(defaultVal)}" 
                     ${isReadOnly} 
                     ${f.required ? 'required' : ''}>
            </div>`;
        }
      });

      if (sec.type === 'signature') {
        if (d.legal_footer) {
          html += `<p class="legal-footer">${esc(d.legal_footer)}</p>`;
        }
        html += `
          <div class="form-group">
            <label>Draw Signature Above *</label>
            <canvas id="signature-canvas" class="sig-pad"></canvas>
            <div class="sig-actions">
              <span class="sig-hint">Sign inside box using mouse or touch</span>
              <button type="button" class="btn-danger-ghost" id="clear-sig">Clear</button>
            </div>
          </div>`;
      }
      html += `</div>`;
    }
  });

  html += `
      <div style="margin-top: 2rem;">
        <button id="submit-btn" class="btn" style="width:100%; padding:0.9rem 2rem;">
          Sign & Execute
        </button>
      </div>
    </div>
  `;

  container.innerHTML = html;

  container.querySelectorAll('input[data-field], select[data-field]').forEach(input => {
    const fn = e => {
      const fieldName = e.target.dataset.field;
      if (e.target.type === 'checkbox') {
        formValues[fieldName] = e.target.checked ? 'Yes' : 'No';
      } else {
        formValues[fieldName] = e.target.value;
      }
    };
    input.addEventListener('input', fn);
    input.addEventListener('change', fn);
  });

  const canvas = document.getElementById('signature-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let strokes = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#000000';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    resizeCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    const startDraw = e => { isDrawing = true; strokes++; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const draw = e => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const stopDraw = () => { isDrawing = false; };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    document.getElementById('clear-sig').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes = 0;
    });

    sigPadInit = {
      hasSignature: () => strokes > 0,
      toSVG: () => canvas.toDataURL()
    };
  }

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const btn = document.getElementById('submit-btn');
    if (sigPadInit && !sigPadInit.hasSignature()) {
      btn.textContent = 'Signature required';
      setTimeout(() => { btn.textContent = 'Sign & Execute'; }, 2000);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Recording Execution…';

    try {
      const payload = {
        fields: formValues,
        signature_data: sigPadInit ? sigPadInit.toSVG() : ''
      };

      const res = await fetch(`${API_BASE}/api/submit/${slug}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Submission failed');

      renderSuccess(doc, result);
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
      btn.textContent = 'Sign & Execute';
    }
  });
}

function renderSuccess(doc, result) {
  const container = document.getElementById('main-content');
  const payloadJson = JSON.stringify(result.payload, null, 2);

  container.innerHTML = `
    <div class="signer-head">
      <div class="signer-eyebrow" style="color: var(--success);">Execution Recorded</div>
      <h1 class="signer-title">Document Signed</h1>
      <p style="margin: 0; color: var(--text-muted); font-size: clamp(13px, 0.95vw, 15px); line-height: 1.6;">${esc(doc.id)} — execution complete. Agreement cryptographically recorded.</p>
    </div>
    <div class="signer-body">
      <div class="signer-meta" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;">
        <span>Submission ID ${esc(result.submission_id)}</span>
      </div>
      <div class="audit-row">
        <div class="section-label">Cryptographic Audit — SHA-256 Digest</div>
        <div class="audit-hash">${esc(result.audit_hash)}</div>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:1rem; margin-top:2rem;">
        <button id="download-pdf-btn" class="btn">
          📄 Download Compiled PDF Agreement
        </button>
        <button id="download-json-btn" class="btn btn-outline">
          📥 Export Local Compact JSON Data
        </button>
      </div>
    </div>
  `;

  document.getElementById('download-pdf-btn').addEventListener('click', async () => {
    const btn = document.getElementById('download-pdf-btn');
    btn.disabled = true;
    btn.textContent = 'Generating PDF...';
    try {
      const res = await fetch(`${API_BASE}/api/render-pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payloadJson
      });
      if (!res.ok) throw new Error('PDF compilation failed');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `executed-agreement-${result.submission_id.slice(0, 8)}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '📄 Download Compiled PDF Agreement';
    }
  });

  document.getElementById('download-json-btn').addEventListener('click', () => {
    const blob = new Blob([payloadJson], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `signed-document-${result.submission_id.slice(0, 8)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

loadDocument();
</script>
