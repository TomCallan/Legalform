<!DOCTYPE html>
<html lang="en">
<head>

  <title>Legal Document Signature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --paper-bg: #ffffff;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --text-heading: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --primary-navy: #1e3a8a;
      --primary-hover: #1e40af;
      --accent-gold: #b45309;
      --danger: #dc2626;
      --shadow-paper: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 4px 6px -2px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 1rem;
      background-color: var(--bg);
      color: var(--text-body);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    @media (min-width: 768px) {
      body { padding: 3rem 1.5rem; }
    }
    .container {
      width: 100%;
      max-width: 820px;
    }
    .paper {
      background: var(--paper-bg);
      border: 1px solid var(--border);
      border-top: 4px solid var(--primary-navy);
      border-radius: 4px;
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-paper);
    }
    @media (min-width: 768px) {
      .paper { padding: 3.5rem 3rem; margin-bottom: 2rem; }
    }
    .doc-header {
      text-align: center;
      border-bottom: 2px solid var(--text-heading);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    .doc-header h1 {
      margin: 0 0 0.5rem 0;
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-heading);
      text-transform: uppercase;
    }
    @media (min-width: 768px) {
      .doc-header h1 { font-size: 2.1rem; }
    }
    .doc-header .jurisdiction {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .prose {
      font-family: 'Newsreader', serif;
      color: #1e293b;
      line-height: 1.8;
      font-size: 1.05rem;
    }
    .prose h1, .prose h2, .prose h3 {
      font-family: 'Cinzel', serif;
      color: var(--text-heading);
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .prose h2 { font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-heading);
    }
    .required::after { content: " *"; color: var(--danger); }
    input[type="text"], input[type="email"], input[type="date"], textarea, select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #ffffff;
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      color: var(--text-heading);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary-navy);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }
    .signature-section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-heading);
      border-bottom: 1px solid var(--text-heading);
      padding-bottom: 0.5rem;
      margin: 2rem 0 1.5rem 0;
    }
    .signature-container {
      position: relative;
      width: 100%;
    }
    .signature-pad {
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      background: #fafafa;
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      height: 190px;
      display: block;
    }
    .signature-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
    }
    .signature-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
    }
    .btn-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.25rem 0.5rem;

    .btn-submit {
      background: var(--primary-navy);
      color: white;
      padding: 1.1rem 2rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 52px;
    }

    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .legal-footer {

      background: #f8fafc;

    }
    .audit-notice {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>

          <p style="color:#94a3b8;font-size:0.9rem;line-height:1.6;margin:0">Records field focus events, value hashes, UTC NTP timestamps, and SHA-256 digests archived to Cloudflare R2 Vault.</p>

} else {

let auditTrail = [];
let signatureData = null;
let spec = null;

function audit(type, data = {}) {
  auditTrail.push({
    type,
    data,
    client_timestamp: Date.now(),
    url: window.location.href
  });
}

fetch(`${API_BASE}/api/doc/${slug}`)
  .then(r => {
    if (!r.ok) throw new Error('Document not found or expired');
    return r.json();
  })
  .then(doc => {
    spec = typeof doc.spec === 'string' ? JSON.parse(doc.spec) : doc.spec;
    document.getElementById('doc-title').textContent = spec.document?.title || 'Legal Document';
    if (spec.document?.jurisdiction) {
      document.getElementById('doc-jurisdiction').textContent = `Jurisdiction: ${spec.document.jurisdiction}`;
    }
    if (doc.expires_at) {
      const d = new Date(doc.expires_at * 1000);
      document.getElementById('doc-expiry').textContent = `Execution Period Expires: ${d.toLocaleDateString()}`;
    }
    renderForm(spec.sections, doc.require_verification);
    audit('page_open', { slug });
  })
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div class="paper" style="text-align:center">
        <h2 style="color:var(--danger);font-family:'Cinzel',serif">Document Error</h2>
        <p style="color:var(--text-body)">${err.message}</p>
      </div>
    `;
  });

function renderSingleField(field) {
  const group = document.createElement('div');
  group.className = 'form-group';

  const label = document.createElement('label');
  label.className = field.required ? 'required' : '';
  label.textContent = field.label || field.signer_label || 'Field';
  group.appendChild(label);

  const fieldType = field.field_type || field.type;

  if (fieldType === 'signature') {
    const sigContainer = document.createElement('div');
    sigContainer.className = 'signature-container';
    
    const canvas = document.createElement('canvas');
    canvas.className = 'signature-pad';
    sigContainer.appendChild(canvas);

    const actions = document.createElement('div');
    actions.className = 'signature-actions';
    actions.innerHTML = '<span class="signature-hint">Draw digital signature in box above</span>';
    
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'btn-clear';
    clearBtn.textContent = 'Clear Signature';
    actions.appendChild(clearBtn);
    sigContainer.appendChild(actions);

    group.appendChild(sigContainer);
    setupSignaturePad(canvas, clearBtn);
  } else if (fieldType === 'select') {
    const select = document.createElement('select');
    select.name = field.name;
    select.required = !!field.required;
    (field.options || []).forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      select.appendChild(o);
    });
    const urlPrefill = params.get(`field_${field.name}`) || params.get(field.name);
    if (urlPrefill !== null) select.value = urlPrefill;
    else if (field.value !== undefined) select.value = field.value;

    select.addEventListener('focus', () => audit('field_focus', { field: field.name }));
    select.addEventListener('blur', () => audit('field_blur', { field: field.name }));
    select.addEventListener('change', (e) => {
      audit('value_change', { field: field.name, hash: btoa(e.target.value).slice(0, 12) });
    });
    group.appendChild(select);
  } else if (fieldType === 'datetime-auto') {
    const input = document.createElement('input');
    input.type = 'text';
    input.name = field.name;
    input.readOnly = true;
    const currentTimestamp = new Date().toUTCString();
    input.value = currentTimestamp;
    input.style.backgroundColor = '#f1f5f9';
    input.style.fontWeight = '600';
    input.style.color = '#1e3a8a';
    group.appendChild(input);
  } else {
    const input = document.createElement(fieldType === 'textarea' ? 'textarea' : 'input');
    input.name = field.name;
    input.required = !!field.required;
    if (field.validation) input.pattern = field.validation;
    if (fieldType) input.type = fieldType;
    if (field.placeholder) input.placeholder = field.placeholder;

    const urlPrefill = params.get(`field_${field.name}`) || params.get(field.name);
    if (urlPrefill !== null) {
      input.value = urlPrefill;
    } else if (field.value !== undefined) {
      input.value = field.value;
    } else if (field.default === 'today' && fieldType === 'date') {
      input.valueAsDate = new Date();
    }

    input.addEventListener('focus', () => audit('field_focus', { field: field.name }));
    input.addEventListener('blur', () => audit('field_blur', { field: field.name }));
    input.addEventListener('change', (e) => {
      audit('value_change', { field: field.name, hash: btoa(e.target.value).slice(0, 12) });
    });

    group.appendChild(input);
  }

  return group;
}

function renderForm(sections, requireVerification) {
  const form = document.getElementById('legal-form');

  sections.forEach((section) => {
    const div = document.createElement('div');
    div.className = 'paper';

    if (section.type === 'static') {
      div.innerHTML = `<div class="prose">${formatMarkdown(section.content)}</div>`;
    } 
    else if (section.type === 'form') {
      (section.fields || []).forEach(f => {
        const group = renderSingleField(f);
        div.appendChild(group);
      });
    }
    else if (section.type === 'signature') {
      if (section.signer_label) {
        const h3 = document.createElement('div');
        h3.className = 'signature-section-title';
        h3.textContent = section.signer_label;
        div.appendChild(h3);
      }
      (section.fields || []).forEach(f => {
        const group = renderSingleField(f);
        div.appendChild(group);
      });

      if (section.pre_signed && section.pre_signature_data) {
        const preSigGroup = document.createElement('div');
        preSigGroup.className = 'form-group';
        preSigGroup.innerHTML = `
          <label style="color:var(--primary-navy)">Owner Pre-Executed Signature of Record</label>
          <div style="background:#f8fafc;border:1px solid var(--border-dark);padding:0.75rem;border-radius:4px;display:inline-block;margin-top:0.25rem;">
            <img src="${section.pre_signature_data}" style="max-height:70px;display:block;" alt="Owner Signature">
          </div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.25rem;">Digitally Pre-Executed by Document Owner</div>
        `;
        div.appendChild(preSigGroup);
      }

      const sigGroup = renderSingleField({ type: 'signature', label: 'Counterparty Signature of Record', name: 'signature' });
      div.appendChild(sigGroup);
    }
    else if (section.type === 'witness') {
      const h3 = document.createElement('div');
      h3.className = 'signature-section-title';
      h3.textContent = section.witness_label || 'NOTARY / WITNESS ATTESTATION OF EXECUTION';
      div.appendChild(h3);

      const witnessNotice = document.createElement('p');
      witnessNotice.style.fontSize = '0.85rem';
      witnessNotice.style.color = 'var(--text-muted)';
      witnessNotice.textContent = section.content || 'I hereby attest under penalty of perjury that I witnessed the execution of this document by the primary party.';
      div.appendChild(witnessNotice);

      const nameGroup = renderSingleField({ name: 'witness_name', label: 'Witness Full Name', type: 'text', required: true });
      const emailGroup = renderSingleField({ name: 'witness_email', label: 'Witness Email Address', type: 'email', required: true });
      div.appendChild(nameGroup);
      div.appendChild(emailGroup);

      (section.fields || []).forEach(f => {
        const group = renderSingleField(f);
        div.appendChild(group);
      });

      const sigGroup = renderSingleField({ type: 'signature', label: 'Witness Attestation Signature', name: 'witness_signature' });
      div.appendChild(sigGroup);
    }
    else if (section.type === 'field') {
      const group = renderSingleField(section);
      div.appendChild(group);
    }

    form.appendChild(div);
  });

  const submitPaper = document.createElement('div');
  submitPaper.className = 'paper';
  
  if (spec.document?.legal_footer) {
    const footerText = document.createElement('div');
    footerText.className = 'legal-footer';
    footerText.textContent = spec.document.legal_footer;
    submitPaper.appendChild(footerText);
  }

  submitPaper.innerHTML += `
    <button type="submit" class="btn-submit">Execute & Sign Legal Instrument</button>
    <div class="audit-notice">
      🔒 Cryptographic Audit Chain Active • Timestamped to Cloudflare D1 & Archived to R2
    </div>
  `;
  form.appendChild(submitPaper);

  form.addEventListener('submit', handleSubmit);
}

function formatMarkdown(text) {
  return text
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function setupSignaturePad(canvas, clearBtn) {
  let ctx;
  const initCanvas = () => {
    canvas.width = canvas.offsetWidth;
    canvas.height = 190;
    ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  };

  setTimeout(initCanvas, 100);
  window.addEventListener('resize', () => {
    if (signatureData === null) initCanvas();
  });

  let drawing = false;
  let points = [];

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  };

  const start = (e) => {
    drawing = true;
    points = [getPos(e)];
  };

  const move = (e) => {
    if (!drawing || !ctx) return;
    if (e.cancelable) e.preventDefault();
    const pos = getPos(e);
    points.push(pos);
    ctx.beginPath();
    ctx.moveTo(points[points.length - 2].x, points[points.length - 2].y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  };

  const end = () => {
    if (!drawing) return;
    drawing = false;
    signatureData = canvas.toDataURL();
    audit('signature_drawn', { stroke_points: points.length });
  };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: true });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  clearBtn.addEventListener('click', () => {
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    signatureData = null;
  });
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = 'Processing Digital Execution...';

  const fields = {};
  let emailValue = '';

  const processFields = (items) => {
    items.forEach(s => {
      if (s.fields) {
        processFields(s.fields);
      } else if (s.name && s.type !== 'signature') {
        const el = document.querySelector(`[name="${s.name}"]`);
        if (el) {
          fields[s.name] = el.type === 'checkbox' ? el.checked : el.value;
          if (s.field_type === 'email' || s.type === 'email' || s.name.includes('email')) {
            emailValue = el.value;
          }
        }
      }
    });
  };

  processFields(spec.sections);

  if (!signatureData) {
    alert('Please complete your handwritten digital signature before submitting.');
    btn.disabled = false;
    btn.textContent = 'Execute & Sign Legal Instrument';
    return;
  }

  const fingerprint = btoa([
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    new Date().getTimezoneOffset()
  ].join('|'));

  audit('submit_start', { field_count: Object.keys(fields).length });

  try {
    const res = await fetch(`${API_BASE}/api/submit/${slug}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: emailValue,
        fields,
        signature_svg: signatureData,
        fingerprint,
        auditTrail,
        verification_token: verificationToken
      })
    });

    const result = await res.json();

    if (res.ok) {
      const jsonBlob = new Blob([JSON.stringify({
        submission_id: result.submission_id,
        document_id: spec.document?.id || 'doc',
        email: emailValue,
        submitted_at: Math.floor(Date.now() / 1000),
        fields,
        signature: signatureData,
        audit_hash: result.audit_hash,
        fingerprint,
        audit_trail: auditTrail,
        spec
      }, null, 2)], { type: 'application/json' });
      const jsonUrl = URL.createObjectURL(jsonBlob);

      document.getElementById('app').innerHTML = `
        <div class="paper" style="text-align:center; padding:3rem 1.5rem">
          <h2 style="font-family:'Cinzel',serif;color:var(--text-heading);margin-top:0">Document Successfully Executed</h2>
          <p style="color:var(--text-muted);max-width:500px;margin:0.5rem auto 1.5rem auto">Your electronic signature and execution telemetry have been recorded to Cloudflare D1 and archived in R2.</p>
          
          <div style="margin-bottom:1.5rem;">
            <a href="${jsonUrl}" download="submission_${result.submission_id}.json" class="btn-submit" style="display:inline-block;text-decoration:none;width:auto;padding:0.75rem 1.5rem;font-size:0.9rem;">
              Download Execution Record (.json)
            </a>
          </div>

          <div style="background:#f8fafc;border:1px solid var(--border-dark);padding:1.25rem;border-radius:4px;text-align:left;font-family:monospace;font-size:0.8rem;word-break:break-all;max-width:600px;margin:0 auto;">
            <div><strong>Submission ID:</strong> ${result.submission_id}</div>
            <div style="margin-top:0.5rem"><strong>Audit Hash:</strong> ${result.audit_hash}</div>
            <div style="margin-top:0.5rem;color:var(--primary-navy)"><strong>R2 Vault Path:</strong> ${result.r2_key}</div>
          </div>
        </div>
      `;
    } else {
      alert(result.error || 'Submission failed.');
      btn.disabled = false;
      btn.textContent = 'Execute & Sign Legal Instrument';
    }
  } catch (err) {
    alert('Network error submitting document: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Execute & Sign Legal Instrument';
  }
}
}
</script>
